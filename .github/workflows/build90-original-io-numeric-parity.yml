name: Build90 original Python OIIO file numeric quantization parity

on:
  push:
    branches:
      - 'port/build90-file-output-icc-lut-40-41-bulk'
    paths:
      - 'ios/SpektraFilmPort/Build90SourceOutputQuantization.swift'
      - 'ios/tests/Build90SourceIOQuantizationValidation.swift'
      - 'ios/scripts/build90_original_io_quantization_oracle.py'
      - '.github/workflows/build90-original-io-numeric-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-output-quantization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned NumPy source AST exact original Python OIIO conversion
        run: |
          python -m pip install --quiet 'numpy==2.4.0'
          git rev-parse HEAD
          python ios/scripts/build90_original_io_quantization_oracle.py \
            /tmp/build90-true-source-file-numeric.json
      - name: Compile actual Swift output quantization and compare 960 values
        run: |
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build90SourceOutputQuantization.swift \
            ios/tests/Build90SourceIOQuantizationValidation.swift \
            -o /tmp/Build90IOQuantization
          /tmp/Build90IOQuantization \
            /tmp/build90-true-source-file-numeric.json
      - uses: actions/upload-artifact@v4
        with:
          name: build90-original-source-file-960-numeric
          path: /tmp/build90-true-source-file-numeric.json
