name: Build89 original output gamut ACES and OFF full custom parameter parity

on:
  push:
    branches:
      - 'port/build89-output-gamut-space-38-39-bulk'
    paths:
      - 'ios/SpektraFilmPort/Build89OriginalOutputGamut.swift'
      - 'ios/scripts/build89_original_aces_off_oracle.py'
      - 'ios/tests/Build89SourceOutputGamutACESEvidence.swift'
      - '.github/workflows/build89-source-aces-off-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-output-gamut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact original source colour-space maths
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            'numpy==2.4.0' 'scipy==1.16.3' \
            'colour-science==0.4.6' 'matplotlib==3.10.8'
      - name: Verify source and execute original output gamut off-aces
        run: |
          git rev-parse HEAD
          python ios/scripts/build89_original_aces_off_oracle.py \
            /tmp/build89-original-aces-off.json
          test -s /tmp/build89-original-aces-off.json
      - name: Regenerate full colour-science source matrices
        run: |
          python ios/scripts/generate_scanner_reference.py
      - name: Compile real native CAM16 dispatcher and source options
        run: |
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/Build89OriginalCAM16.swift \
            ios/SpektraFilmPort/Build89OriginalOutputGamut.swift \
            ios/tests/Build89SourceOutputGamutACESEvidence.swift \
            -o /tmp/Build89SourceACES
          /tmp/Build89SourceACES /tmp/build89-original-aces-off.json
      - uses: actions/upload-artifact@v4
        with:
          name: build89-original-source-126-custom-aces-off-hdr
          path: /tmp/build89-original-aces-off.json
