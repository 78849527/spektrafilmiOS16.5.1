name: iOS 16.5.1 — v1.8.0 source-ordered Metal optical grain

on:
  push:
    branches: ['ios16.5.1/original-metal-grain-v1.8']
    paths:
      - 'ios/**'
      - '.github/workflows/ios16.yml'
  workflow_dispatch:

permissions:
  contents: write

# Prevent older push runs from re-uploading their IPA over a newer SHA.
concurrency:
  group: ios1651-original-metal-grain-v1.8-release
  cancel-in-progress: true

jobs:
  build:
    # Intel CI availability for rapid iOS16 compatibility validation.
    # GPU shader dispatch now uses universal dispatchThreadgroups.
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout v1.4 optical-print branch
        uses: actions/checkout@v4
      - name: Pin verified iOS 16.5.1 toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile native Core Image spatial optics tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SpatialOptics.swift \
            ios/tests/SpatialOpticsValidation.swift \
            -o /tmp/SpektrafilmSpatialValidation
      - name: Verify spatial optics energy conservation and real blur
        run: NSUnbufferedIO=YES /tmp/SpektrafilmSpatialValidation
      - name: Compile density-grain GPU statistical regression
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/DensityGrain.swift \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/tests/DensityGrainValidation.swift \
            -o /tmp/SpektrafilmDensityGrainValidation
      - name: Verify optical grain density moments and deterministic sampling
        run: NSUnbufferedIO=YES /tmp/SpektrafilmDensityGrainValidation
      - name: Compile native scanner XYZ/gamut maths and GPU finishing tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/ScannerFinishing.swift \
            ios/tests/ScannerFinishingValidation.swift \
            -o /tmp/ScannerFinishValidation
      - name: Verify source scanner glare and unsharp Core Image math
        run: NSUnbufferedIO=YES /tmp/ScannerFinishValidation
      - name: Prepare Python reference generator (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original colour-science reference dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet 'numpy==1.26.4' 'scipy==1.15.3' 'colour-science==0.4.6' 'matplotlib==3.10.7' 'numba==0.61.2'
      - name: Generate original profile metadata and spectral numeric arrays
        run: |
          python3 ios/scripts/generate_compact_catalog.py
          python3 ios/scripts/generate_spectral_data.py
          python3 ios/scripts/generate_original_optics.py
          python3 ios/scripts/generate_hanatos.py
          python3 ios/scripts/generate_dir.py
          python3 ios/scripts/generate_dir_spatial.py
          python3 ios/scripts/generate_sublayer_grain.py
          python3 ios/scripts/generate_original_metal_grain.py
          python3 ios/scripts/generate_source_iir.py
          python3 ios/scripts/generate_scanner_reference.py
          python3 ios/scripts/generate_cam16_gamut.py
          python3 ios/scripts/generate_print_morph.py
          python3 ios/scripts/generate_print_optics.py
          test -s ios/SpektraFilmPort/GeneratedPrintMorphData.swift
          test -s ios/SpektraFilmPort/GeneratedPrintOpticsReference.swift
          test -s ios/SpektraFilmPort/GeneratedCAM16Gamut.swift
          test -s ios/SpektraFilmPort/GeneratedScannerReference.swift
          test -s ios/SpektraFilmPort/GeneratedDIRData.swift
          test -s ios/SpektraFilmPort/GeneratedDIRSpatialReference.swift
          test -s ios/SpektraFilmPort/GeneratedSublayerGrainReference.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalMetalGrainReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceIIRReference.swift
          test -s ios/SpektraFilmPort/GeneratedHanatosData.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalOptics.swift
          test -s ios/SpektraFilmPort/GeneratedMeasuredProfiles.swift
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
          test ! -d ios/SpektraFilmPort/Resources
      - name: Compile original scanner XYZ/ACES Python reference validation
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/OriginalCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedCAM16Gamut.swift \
            ios/tests/ScannerMathValidation.swift \
            -o /tmp/SpektrafilmScannerMathValidation
      - name: Verify Python/Swift colour science CAT and ACES references
        run: /tmp/SpektrafilmScannerMathValidation
      - name: Compile source CAM16 gamut table and interpolation tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalCAM16Gamut.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/tests/CAM16GamutValidation.swift \
            -o /tmp/SpektrafilmCAM16Validation
      - name: Verify source default CAM16 reference parity
        run: /tmp/SpektrafilmCAM16Validation
      - name: Compile and test original s023 print morphology and paper exposure reference
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalPrintMorph.swift \
            ios/SpektraFilmPort/OriginalPrintReference.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/GeneratedPrintMorphData.swift \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/tests/PrintMorphValidation.swift \
            -o /tmp/SpektrafilmPrintMorphValidation
      - name: Verify 8 original s023 print media and 16 NumPy exposure references
        run: NSUnbufferedIO=YES /tmp/SpektrafilmPrintMorphValidation
      - name: Compile and test original CMY dichroic and preflash NumPy references
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalPrintOptics.swift \
            ios/SpektraFilmPort/GeneratedOriginalOptics.swift \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/SpektraFilmPort/GeneratedPrintOpticsReference.swift \
            ios/tests/PrintOpticsValidation.swift \
            -o /tmp/SpektrafilmPrintOpticsValidation
      - name: Verify source CMY/preflash/normalization in print exposure buffer
        run: NSUnbufferedIO=YES /tmp/SpektrafilmPrintOpticsValidation
      - name: Compile source native Metal kernels and original measured references
        run: |
          xcrun -sdk macosx metal -c -std=macos-metal2.4 \
            ios/SpektraFilmPort/OriginalGrainKernels.metal \
            -o /tmp/SpektrafilmOriginalGrain.air
          xcrun -sdk macosx metallib \
            /tmp/SpektrafilmOriginalGrain.air \
            -o /tmp/SpektrafilmOriginalGrain.metallib
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/GeneratedOriginalMetalGrainReference.swift \
            ios/tests/OriginalMetalGrainValidation.swift \
            -o /tmp/SpektrafilmOriginalMetalGrainValidation
      - name: Compare actual Metal dye-cloud/reflect shaders to original NumPy
        id: metal_source_gpu
        # Hosted Intel GPU may not execute compute kernels (the probe
        # returned all zeros despite successful texture uploads). Preserve
        # the result and allow unsigned test IPA packaging, but NEVER
        # certify/publish this release when this check failed.
        continue-on-error: true
        run: NSUnbufferedIO=YES /tmp/SpektrafilmOriginalMetalGrainValidation /tmp/SpektrafilmOriginalGrain.metallib
      - name: Compile source Young-van Vliet native Metal and NumPy reference test
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/tests/OriginalMetalIIRValidation.swift \
            -o /tmp/SpektrafilmOriginalIIRValidation
      - name: Compare actual Metal YVV IIR with upstream source
        id: iir_source_gpu
        continue-on-error: true
        run: NSUnbufferedIO=YES /tmp/SpektrafilmOriginalIIRValidation /tmp/SpektrafilmOriginalGrain.metallib
      - name: Require source RNG, float, full-image and real-iPhone evidence
        id: precision_certificate
        continue-on-error: true
        run: python3 ios/scripts/verify_precision_release.py
      - name: Compile source discrete Poisson GPU film particle tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/tests/DiscreteGrainValidation.swift \
            -o /tmp/SpektrafilmDiscreteGrainValidation
      - name: Verify Poisson thinning moments and low/high-rate discrete GPU particles
        run: NSUnbufferedIO=YES /tmp/SpektrafilmDiscreteGrainValidation
      - name: Compile source 3x3 emulsion grain and NumPy moments tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/GeneratedSublayerGrainReference.swift \
            ios/tests/SublayerGrainValidation.swift \
            -o /tmp/SpektrafilmSublayerGrainValidation
      - name: Verify 3 measured emulsion layers and GPU nine-particle distributions
        run: NSUnbufferedIO=YES /tmp/SpektrafilmSublayerGrainValidation
      - name: Compile native spatial DIR and original NumPy inhibition tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SpatialDIR.swift \
            ios/SpektraFilmPort/DensityGrain.swift \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/GeneratedDIRData.swift \
            ios/SpektraFilmPort/GeneratedDIRSpatialReference.swift \
            ios/tests/SpatialDIRValidation.swift \
            -o /tmp/SpektrafilmSpatialDIRValidation
      - name: Verify source interlayer DIR inhibition and CoreImage diffusion
        run: NSUnbufferedIO=YES /tmp/SpektrafilmSpatialDIRValidation
      - name: Compile native spectral physics separately
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SpectralPhysics.swift \
            ios/SpektraFilmPort/SpatialDIR.swift \
            ios/SpektraFilmPort/DensityGrain.swift \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalPrintOptics.swift \
            ios/SpektraFilmPort/OriginalPrintMorph.swift \
            ios/SpektraFilmPort/OriginalPrintReference.swift \
            ios/SpektraFilmPort/GeneratedPrintMorphData.swift \
            ios/SpektraFilmPort/OriginalHanatosResponse.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/OriginalCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/SpektraFilmPort/GeneratedOriginalOptics.swift \
            ios/SpektraFilmPort/GeneratedHanatosData.swift \
            ios/SpektraFilmPort/GeneratedDIRData.swift \
            ios/SpektraFilmPort/GeneratedSublayerGrainReference.swift \
            ios/tests/SpectralValidation.swift \
            -o /tmp/SpektrafilmSpectralValidation
      - name: Run numeric physics and LUT regression checks
        run: /tmp/SpektrafilmSpectralValidation
      - name: Guard iOS 16 floating editor cold-start regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          assert "@State private var controlsVisible = false" in source
          assert source.count("if controlsVisible && model.hasPhoto") >= 2
          assert ".onChange(of: model.hasPhoto)" not in source
          assert "@GestureState" not in source
          assert ".simultaneousGesture(" not in source
          assert "StableImageHoldRecognizer" in source
          print("PASS: launch rendering defers both pickers and adjustment dock")
          PY
      - name: Guard full-size Photos save and double-tap defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("ios/SpektraFilmPort/PhotoProcessor.swift").read_text()
          model = Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          editor = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          saver = Path("ios/SpektraFilmPort/PhotoLibrarySaver.swift").read_text()
          assert '12_500_000' not in source
          assert 'to: source, lut: lut' in source
          assert 'kCGImageDestinationLossyCompressionQuality as String: 0.98' in source
          assert 'PhotoLibrarySaver.saveJPEG(at: file)' in model
          assert 'Task.detached(priority: .userInitiated)' in model
          assert 'requestAuthorization(for: .addOnly)' in saver
          assert 'creationRequestForAssetFromImage' in saver
          assert 'onSaveToPhotos' in editor
          assert editor.count('.onTapGesture(count: 2)') >= 6
          assert 'NSPhotoLibraryAddUsageDescription' in Path("ios/project.yml").read_text()
          print("PASS: native add-only save, no silent downsample, per-control double-tap reset")
          PY
      - name: Guard opt-in DIR respects original full-size output and cold-start
        run: |
          python3 - <<'PY'
          from pathlib import Path
          model = Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          source = Path("ios/SpektraFilmPort/PhotoProcessor.swift").read_text()
          stage = Path("ios/SpektraFilmPort/SpatialDIR.swift").read_text()
          ui = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          assert '@Published var spatialDIREnabled = false' in model
          assert 'makeSpatialDIRStageData(' in model
          assert 'dirStage: currentDIRStage' in model
          assert 'dirStage: spatialDIRStage' in model
          assert 'SpatialDIR.apply(' in source
          assert 'DensityGrain.perturbDensityImage' in stage
          assert 'sourceDIRSubtract' in stage
          assert '原版 DIR 空间显影' in ui
          print("PASS: opt-in source spatial DIR before paper and grain on preview/export")
          PY
      - name: Guard source sublayer opt-in and physical density ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path("ios/SpektraFilmPort/SpectralPhysics.swift").read_text()
          model = Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          stage = Path("ios/SpektraFilmPort/DensityGrain.swift").read_text()
          source = Path("ios/SpektraFilmPort/OriginalSublayerGrain.swift").read_text()
          ui = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          assert 'densityCurvesLayers' in engine
          assert 'layerDensity(total:' in engine
          assert 'sublayerCubes: stage.sublayerCubes' in model
          assert '@Published var grainSublayersEnabled = false' in model
          assert 'measuredSublayersEnabled: grainSublayersEnabled' in model
          assert 'OriginalSublayerGrain.perturb(' in stage
          assert 'measuredThreeSublayers' in source
          assert '实测三乳剂亚层' in ui
          print("PASS: source 3x3 measured emulsion density, default opt-out, old and DIR print paths")
          PY
      - name: Guard Poisson source-law selection and previous HD output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          model = Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          grain = Path("ios/SpektraFilmPort/DensityGrain.swift").read_text()
          sample = Path("ios/SpektraFilmPort/OriginalDiscreteGrain.swift").read_text()
          ui = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          assert '@Published var grainDiscreteParticlesEnabled = false' in model
          assert 'discreteParticlesEnabled: grainDiscreteParticlesEnabled' in model
          assert 'OriginalDiscreteGrain.perturb(' in grain
          assert 'pDrawPoisson' in sample
          assert '原版离散 Poisson 颗粒' in ui
          assert 'OriginalSublayerGrain.perturb(' in grain
          assert 'NSPhotoLibraryAddUsageDescription' in Path("ios/project.yml").read_text()
          print("PASS: source Poisson discreteness is an opt-in film-density GPU stage")
          PY
      - name: Guard source original Metal mode, no fallback, background preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          model=Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          photo=Path("ios/SpektraFilmPort/PhotoProcessor.swift").read_text()
          density=Path("ios/SpektraFilmPort/DensityGrain.swift").read_text()
          original=Path("ios/SpektraFilmPort/OriginalMetalGrain.swift").read_text()
          metal=Path("ios/SpektraFilmPort/OriginalGrainKernels.metal").read_text()
          ui=Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          assert '@Published var grainOriginalMetalEnabled = false' in model
          assert 'Task.detached(priority: .userInitiated)' in model
          assert 'originalMetalPreviewVersion' in model
          assert 'originalMetalEnabled: grainOriginalMetalEnabled' in model
          assert 'try OriginalMetalGrain.render(' in density
          assert '禁止退回快速模式' in photo
          assert 'try SpatialDIR.apply(' in photo
          assert 'originalFilmGaussianReflect' in metal
          assert 'originalFilmMicroClump' in metal
          assert 'physicalCoefficients(' in original
          assert '原版 Metal 显影链' in ui
          assert '检测本机 Metal 显影内核' in ui
          assert 'checkOriginalMetalHardware' in model
          assert 'hardwareDiagnostic()' in original
          print("PASS: strict source Metal branch, original-density ordering and nonblocking preview")
          PY
      - name: Generate project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Compile unsigned iPhoneOS device release
        run: |
          xcodebuild -project ios/SpektraFilmPort.xcodeproj \
            -scheme SpektraFilmPort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS 16.5 and bundle identity
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app
          test -f "$APP/SpektraFilmPort"
          test -s "$APP/default.metallib"
          plutil -lint "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist" | grep -qx 'com.twogou.spektrafilmport'
          /usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist" | grep -qx 'SpektraFilmPort'
          /usr/libexec/PlistBuddy -c "Print CFBundlePackageType" "$APP/Info.plist" | grep -qx 'APPL'
          /usr/libexec/PlistBuddy -c "Print MinimumOSVersion" "$APP/Info.plist" | grep -Eq '^16\.5(\.0)?$'
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist" | grep -qx '1.8.0'
          test ! -e "$APP/Resources/profiles/index.json"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist" | grep -qx '25'
          /usr/libexec/PlistBuddy -c "Print NSPhotoLibraryAddUsageDescription" "$APP/Info.plist" | grep -q '相册'
      - name: Package v1.8 unsigned IPA
        run: |
          mkdir -p ios/build/package/Payload
          cp -R ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app ios/build/package/Payload/
          cd ios/build/package
          zip -q -r ../SpektraFilmPort-iOS16.5.1-v1.8.0-original-metal-unsigned.ipa Payload
      - name: Upload v1.8 IPA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpektraFilmPort-iOS16.5.1-v1.8.0-original-metal-unsigned
          path: ios/build/SpektraFilmPort-iOS16.5.1-v1.8.0-original-metal-unsigned.ipa
          if-no-files-found: error
      - name: Publish explicitly unverified on-device diagnostic IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/ios16.5.1/original-metal-grain-v1.8' && (steps.metal_source_gpu.outcome != 'success' || steps.iir_source_gpu.outcome != 'success' || steps.precision_certificate.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ios1651-v1.8.0-metal-UNVERIFIED-TEST
          SOURCE=ios/build/SpektraFilmPort-iOS16.5.1-v1.8.0-original-metal-unsigned.ipa
          ASSET=ios/build/SpektraFilmPort-iOS16.5.1-v1.8.0-EXPERIMENTAL-UNVERIFIED-unsigned.ipa
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/ios16.5.1/original-metal-grain-v1.8" --jq '.object.sha')
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping stale experimental binary (head=$CURRENT_HEAD)"
            exit 0
          fi
          cp "$SOURCE" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
              --title "TEST ONLY | SpektraFilm iOS 16.5.1 v1.8 - GPU NOT VERIFIED" \
              --notes "WARNING: EXPERIMENTAL TEST BUILD, NOT A CERTIFIED RELEASE. Full iPhoneOS build and previous color/film regression succeeded, but the Intel CI Metal GPU passthrough returned all zero values. This IPA includes a real-device GPU diagnostic button under Density Grain > 3 Measured Layers > Original Metal. Run that diagnostic before trusting emulsion output. Source Metal path fails explicitly and never silently uses fast approximations; fast mode remains the default. Unsigned IPA requires user signing. Share the on-device diagnostics/result if a failure occurs. GPU parity and physical phone tests have NOT passed." \
              --prerelease
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="$GITHUB_SHA" -F force=true
          ACTUAL=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          test "$ACTUAL" = "$GITHUB_SHA"
          gh release view "$TAG" --json tagName,url
          echo "TEST ONLY: signed install needed; no certified source parity."
      - name: Publish isolated v1.8 prerelease and synchronize tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/ios16.5.1/original-metal-grain-v1.8' && steps.metal_source_gpu.outcome == 'success' && steps.iir_source_gpu.outcome == 'success' && steps.precision_certificate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ios1651-v1.8.0-metal
          ASSET=ios/build/SpektraFilmPort-iOS16.5.1-v1.8.0-original-metal-unsigned.ipa
          # A superseded run must never publish its older binary.
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/ios16.5.1/original-metal-grain-v1.8" --jq '.object.sha')
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping release from superseded commit $GITHUB_SHA (head=$CURRENT_HEAD)"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
              --title "SpektraFilm iOS 16.5.1 v1.8.0 — source-order native Metal dye clouds and microstructure" \
              --notes "v1.8 adds opt-in source-order Metal Compute grain: 3 measured film H-D emulsion sublayers, source Poisson thinning, per-layer/channel dye-cloud blur sigma=sqrt(ODparticle) and real reflect-boundary Gaussian convolution, source lognormal microstructure activation and 0.2um clumping blur, subtract density minima, final 0.65px film blur, then original paper/scan path. Full-resolution output uses 512px Metal tiles with analytic halo to limit intermediate memory, no resampling. Original mode fails explicitly and NEVER silently degrades; previews render off main thread. Python/NumPy 12 stock/pixel reference vectors and actual Metal reflect-boundary tests check formulas and shader, alongside earlier DIR/optics and native iPhoneOS build. Caveat: SciPy RNG streams vs GPU hash and Float64 vs Float32 rounding are not bit-identical. Existing v1.7 fast grain remains default. Unsigned IPA needs signing. Real iPhone16.5 test still pending." \
              --prerelease
          fi
          # Editing a Release's target_commitish does NOT move an existing
          # lightweight git tag. Pin the real tag ref to the tested commit.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="$GITHUB_SHA" -F force=true
          ACTUAL_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          test "$ACTUAL_TAG" = "$GITHUB_SHA"
          echo "PASS: release asset and real tag point to tested SHA $GITHUB_SHA"
      - name: Reject source Metal certification when native GPU parity failed
        if: always() && (steps.metal_source_gpu.outcome != 'success' || steps.iir_source_gpu.outcome != 'success' || steps.precision_certificate.outcome != 'success')
        run: |
          echo "::error::Source grain/IIR GPU or complete original RNG/float/full-image/real-iPhone certification is missing or failed. Unsigned IPA exists only as an experimental Actions artifact. NO v1.8 certified release."
          exit 1
