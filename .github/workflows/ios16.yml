        run: |
          TAG=ios1651-v1.8.9-metal
          ASSET=ios/build/SpektraFilmPort-iOS16.5.1-v1.8.9-original-metal-unsigned.ipa
          # A superseded run must never publish its older binary.
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/ios16.5.1/source-rgb-parity-v1.8.9" --jq '.object.sha')
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping release from superseded commit $GITHUB_SHA (head=$CURRENT_HEAD)"
