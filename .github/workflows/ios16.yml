name: iOS 16.5.1 — v1.8.9 source-scanned RGB numerical evidence

on:
  push:
    branches: ['ios16.5.1/source-rgb-parity-v1.8.9']
    paths:
      - 'ios/**'
      - 'docs/v1.8.9-stage-rgb-gpu-probe.md'
      - '.github/workflows/ios16.yml'
  workflow_dispatch:

permissions:
  contents: write

# Prevent older push runs from re-uploading their IPA over a newer SHA.
concurrency:
  group: ios1651-source-rgb-parity-v1.8.9-release
  cancel-in-progress: true

jobs:
  build:
    # Intel CI availability for rapid iOS16 compatibility validation.
    # GPU shader dispatch now uses universal dispatchThreadgroups.
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout v1.4 optical-print branch
        uses: actions/checkout@v4
      - name: Pin verified iOS 16.5.1 toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile native Core Image spatial optics tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SpatialOptics.swift \
            ios/tests/SpatialOpticsValidation.swift \
            -o /tmp/SpektrafilmSpatialValidation
      - name: Verify spatial optics energy conservation and real blur
        run: NSUnbufferedIO=YES /tmp/SpektrafilmSpatialValidation
      - name: Compile native scanner XYZ/gamut maths and GPU finishing tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/ScannerFinishing.swift \
            ios/tests/ScannerFinishingValidation.swift \
            -o /tmp/ScannerFinishValidation
      - name: Verify source scanner glare and unsharp Core Image math
        run: NSUnbufferedIO=YES /tmp/ScannerFinishValidation
      - name: Prepare Python reference generator (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original colour-science reference dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet 'numpy==1.26.4' 'scipy==1.15.3' 'colour-science==0.4.6' 'matplotlib==3.10.7' 'numba==0.61.2' 'opt_einsum==3.4.0'
      - name: Verify low-rate original Poisson numerical sampler and reject silent approximation
        run: python3 ios/scripts/validate_poisson_sampler.py
      - name: Generate original profile metadata and spectral numeric arrays
        run: |
          python3 ios/scripts/generate_compact_catalog.py
          python3 ios/scripts/generate_spectral_data.py
          python3 ios/scripts/generate_original_optics.py
          python3 ios/scripts/generate_hanatos.py
          python3 ios/scripts/generate_dir.py
          python3 ios/scripts/generate_dir_spatial.py
          python3 ios/scripts/generate_sublayer_grain.py
          python3 ios/scripts/generate_original_metal_grain.py
          python3 ios/scripts/generate_original_source_rng.py
          python3 ios/scripts/generate_source_iir.py
          python3 ios/scripts/generate_source_mt19937.py
          python3 ios/scripts/generate_original_scipy_rng.py
          python3 ios/scripts/generate_source_replay.py
          python3 ios/scripts/generate_source_microstructure.py
          python3 ios/scripts/generate_source_rgb_parity.py
          python3 ios/scripts/generate_scanner_reference.py
          python3 ios/scripts/generate_cam16_gamut.py
          python3 ios/scripts/generate_print_morph.py
          python3 ios/scripts/generate_print_optics.py
          test -s ios/SpektraFilmPort/GeneratedPrintMorphData.swift
          test -s ios/SpektraFilmPort/GeneratedPrintOpticsReference.swift
          test -s ios/SpektraFilmPort/GeneratedCAM16Gamut.swift
          test -s ios/SpektraFilmPort/GeneratedScannerReference.swift
          test -s ios/SpektraFilmPort/GeneratedDIRData.swift
          test -s ios/SpektraFilmPort/GeneratedDIRSpatialReference.swift
          test -s ios/SpektraFilmPort/GeneratedSublayerGrainReference.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalMetalGrainReference.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalSourceRNGReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceIIRReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceReplayReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceRGBReference.swift
          test -s ios/SpektraFilmPort/GeneratedHanatosData.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalOptics.swift
          test -s ios/SpektraFilmPort/GeneratedMeasuredProfiles.swift
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
          test ! -d ios/SpektraFilmPort/Resources
      - name: Compile exact SciPy Poisson / Binomial MT stream regression
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/tests/OriginalSciPyRNGValidation.swift \
            -o /tmp/SpektraFilmSourceSciPyValidation
      - name: Verify authentic source Poisson and Binomial arrays plus MT words
        run: NSUnbufferedIO=YES /tmp/SpektraFilmSourceSciPyValidation
      - name: Compile exact legacy NumPy MT19937 uint32 and Float64 uniform tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/tests/OriginalSourceMT19937Validation.swift \
            -o /tmp/SpektraFilmSourceMTValidation
      - name: Compare 2640 original NumPy MT words and 160 bit-exact Float64 uniforms
        run: NSUnbufferedIO=YES /tmp/SpektraFilmSourceMTValidation
      - name: Compile source Numba microstructure deterministic lognormal tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/tests/SourceMicrostructureValidation.swift \
            -o /tmp/SpektrafilmMicrostructureValidation
      - name: Verify source Numba microstructure mean/std transform and gating
        run: NSUnbufferedIO=YES /tmp/SpektrafilmMicrostructureValidation
      - name: Compile density-grain GPU statistical regression
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/DensityGrain.swift \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/tests/DensityGrainValidation.swift \
            -o /tmp/SpektrafilmDensityGrainValidation
      - name: Verify optical grain density moments and deterministic sampling
        run: NSUnbufferedIO=YES /tmp/SpektrafilmDensityGrainValidation
      - name: Compile original scanner XYZ/ACES Python reference validation
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/OriginalCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedCAM16Gamut.swift \
            ios/tests/ScannerMathValidation.swift \
            -o /tmp/SpektrafilmScannerMathValidation
      - name: Verify Python/Swift colour science CAT and ACES references
        run: /tmp/SpektrafilmScannerMathValidation
      - name: Compile source CAM16 gamut table and interpolation tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalCAM16Gamut.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/tests/CAM16GamutValidation.swift \
            -o /tmp/SpektrafilmCAM16Validation
      - name: Verify source default CAM16 reference parity
        run: /tmp/SpektrafilmCAM16Validation
      - name: Compile and test original s023 print morphology and paper exposure reference
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalPrintMorph.swift \
            ios/SpektraFilmPort/OriginalPrintReference.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/GeneratedPrintMorphData.swift \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/tests/PrintMorphValidation.swift \
            -o /tmp/SpektrafilmPrintMorphValidation
      - name: Verify 8 original s023 print media and 16 NumPy exposure references
        run: NSUnbufferedIO=YES /tmp/SpektrafilmPrintMorphValidation
      - name: Compile and test original CMY dichroic and preflash NumPy references
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalPrintOptics.swift \
            ios/SpektraFilmPort/GeneratedOriginalOptics.swift \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/SpektraFilmPort/GeneratedPrintOpticsReference.swift \
            ios/tests/PrintOpticsValidation.swift \
            -o /tmp/SpektrafilmPrintOpticsValidation
      - name: Verify source CMY/preflash/normalization in print exposure buffer
        run: NSUnbufferedIO=YES /tmp/SpektrafilmPrintOpticsValidation
      - name: Compile source native Metal kernels and original measured references
        run: |
          xcrun -sdk macosx metal -c -std=macos-metal2.4 \
            ios/SpektraFilmPort/OriginalGrainKernels.metal \
            -o /tmp/SpektrafilmOriginalGrain.air
          xcrun -sdk macosx metallib \
            /tmp/SpektrafilmOriginalGrain.air \
            -o /tmp/SpektrafilmOriginalGrain.metallib
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/SpektraFilmPort/GeneratedOriginalMetalGrainReference.swift \
            ios/tests/OriginalMetalGrainValidation.swift \
            -o /tmp/SpektrafilmOriginalMetalGrainValidation
      - name: Compare actual Metal dye-cloud/reflect shaders to original NumPy
        id: metal_source_gpu
        # Hosted Intel GPU may not execute compute kernels (the probe
        # returned all zeros despite successful texture uploads). Preserve
        # the result and allow unsigned test IPA packaging, but NEVER
        # certify/publish this release when this check failed.
        continue-on-error: true
        run: NSUnbufferedIO=YES /tmp/SpektrafilmOriginalMetalGrainValidation /tmp/SpektrafilmOriginalGrain.metallib
      - name: Compile source Young-van Vliet native Metal and NumPy reference test
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/tests/OriginalMetalIIRValidation.swift \
            -o /tmp/SpektrafilmOriginalIIRValidation
      - name: Compare actual Metal YVV IIR with upstream source
        id: iir_source_gpu
        continue-on-error: true
        run: NSUnbufferedIO=YES /tmp/SpektrafilmOriginalIIRValidation /tmp/SpektrafilmOriginalGrain.metallib
      - name: Compile original SciPy particle-field source replay with production YVV
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/SpektraFilmPort/OriginalMetalSourceReplay.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/tests/OriginalMetalSourceReplayValidation.swift \
            -o /tmp/SpektraFilmSourceReplayValidation
      - name: Compare source-injected nine-field optical density on real Metal GPU
        id: source_replay_gpu
        continue-on-error: true
        run: NSUnbufferedIO=YES /tmp/SpektraFilmSourceReplayValidation /tmp/SpektrafilmOriginalGrain.metallib
      - name: Require source RNG, float, full-image and real-iPhone evidence
        id: precision_certificate
        continue-on-error: true
        run: python3 ios/scripts/verify_precision_release.py
      - name: Compile source discrete Poisson GPU film particle tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/tests/DiscreteGrainValidation.swift \
            -o /tmp/SpektrafilmDiscreteGrainValidation
      - name: Verify Poisson thinning moments and low/high-rate discrete GPU particles
        run: NSUnbufferedIO=YES /tmp/SpektrafilmDiscreteGrainValidation
      - name: Compile source 3x3 emulsion grain and NumPy moments tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/SpektraFilmPort/GeneratedSublayerGrainReference.swift \
            ios/tests/SublayerGrainValidation.swift \
            -o /tmp/SpektrafilmSublayerGrainValidation
      - name: Verify 3 measured emulsion layers and GPU nine-particle distributions
        run: NSUnbufferedIO=YES /tmp/SpektrafilmSublayerGrainValidation
      - name: Compile native spatial DIR and original NumPy inhibition tests
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SpatialDIR.swift \
            ios/SpektraFilmPort/DensityGrain.swift \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/SpektraFilmPort/GeneratedDIRData.swift \
            ios/SpektraFilmPort/GeneratedDIRSpatialReference.swift \
            ios/tests/SpatialDIRValidation.swift \
            -o /tmp/SpektrafilmSpatialDIRValidation
      - name: Verify source interlayer DIR inhibition and CoreImage diffusion
        run: NSUnbufferedIO=YES /tmp/SpektrafilmSpatialDIRValidation
      - name: Compile native spectral physics separately
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SpectralPhysics.swift \
            ios/SpektraFilmPort/OriginalSourceRGBParity.swift \
            ios/SpektraFilmPort/GeneratedSourceRGBReference.swift \
            ios/SpektraFilmPort/SpatialDIR.swift \
            ios/SpektraFilmPort/DensityGrain.swift \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/SpektraFilmPort/OriginalPrintOptics.swift \
            ios/SpektraFilmPort/OriginalPrintMorph.swift \
            ios/SpektraFilmPort/OriginalPrintReference.swift \
            ios/SpektraFilmPort/GeneratedPrintMorphData.swift \
            ios/SpektraFilmPort/OriginalHanatosResponse.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/OriginalCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/SpektraFilmPort/GeneratedOriginalOptics.swift \
            ios/SpektraFilmPort/GeneratedHanatosData.swift \
            ios/SpektraFilmPort/GeneratedDIRData.swift \
            ios/SpektraFilmPort/GeneratedSublayerGrainReference.swift \
            ios/tests/SpectralValidation.swift \
            -o /tmp/SpektrafilmSpectralValidation
      - name: Run numeric physics and LUT regression checks
        run: /tmp/SpektrafilmSpectralValidation
      - name: Guard honest stage-limited Python RGB error evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          swift=Path("ios/SpektraFilmPort/OriginalSourceRGBParity.swift").read_text()
          model=Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          generator=Path("ios/scripts/generate_source_rgb_parity.py").read_text()
          assert "sourceEncodedRGB" in swift and "sourceXYZ" in swift
          assert "stageEvidence" in swift and "directPositiveScannerStages(" in swift
          assert "sourceCompressedRGB" in generator
          assert "engine.scanFilmDensity(" in swift
          assert "mae:" in swift and "rmse:" in swift and "maximum:" in swift
          assert "原版 RGB 数值对照｜不计入 8/8 认证" in model
          assert "source_scan(" in generator and "compress_rgb_aces_rgc(" in generator
          assert "return xyz[0],linear[0],compressed[0],encoded[0]" in generator
          assert "OutputGamutCompressSpec" not in generator
          assert "NOT whole rendering" in generator or "NOT whole rendering" in swift
          print("PASS: stage-scoped original reversal-film RGB truth vectors and explicit MAE/RMSE/max, NOT full film->print->RGB certification")
          PY
      - name: Guard iOS 16 floating editor cold-start regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          assert "@State private var controlsVisible = false" in source
          assert source.count("if controlsVisible && model.hasPhoto") >= 2
          assert ".onChange(of: model.hasPhoto)" not in source
          assert "@GestureState" not in source
          assert ".simultaneousGesture(" not in source
          assert "StableImageHoldRecognizer" in source
          print("PASS: launch rendering defers both pickers and adjustment dock")
          PY
      - name: Guard clickable right-hand numeric slider reset and original defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          model = Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          for token in (
              '点右侧数值恢复默认',
              'accessibilityLabel("效果强度，点击数值恢复默认 100%")',
              '点击数值恢复默认 0 EV',
              'value.wrappedValue = resetTo',
              'Text(String(format: "%.2f", value.wrappedValue) + suffix)',
              'Button {',
              '.buttonStyle(.plain)',
          ):
              assert token in source, token
          for item in (
              '@Published var strength = 1.0',
              '@Published var filmExposureEV = 0.0',
              '@Published var printExposureEV = 0.0',
              '@Published var scannerSharpenAmount = 0.7',
              '@Published var grainAmount = 1.0',
          ):
              assert item in model, item
          print("PASS: all four slider helper kinds expose value-tap default reset; model source defaults retained")
          PY
      - name: Compile standalone source-safe output sizing regression
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SafeExportResolution.swift \
            ios/tests/SafeExportResolutionValidation.swift \
            -o /tmp/SpektrafilmSafeExportValidation
      - name: Verify adaptive 50% and economy 3MP whole-frame memory geometry
        run: /tmp/SpektrafilmSafeExportValidation
      - name: Guard original, adaptive and economy export for Photos and Files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          photo=Path("ios/SpektraFilmPort/PhotoProcessor.swift").read_text()
          model=Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          ui=Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          assert 'resolution: ExportResolutionMode = .original' in photo
          assert 'var workingSource = source' in photo
          assert 'if resolution != .original' in photo
          assert 'SafeExportResolution.capture(' in photo
          assert 'lanczosScaleTransform()' in photo
          assert 'to: workingSource, lut: lut' in photo
          assert 'downsampled: downsampled' in photo
          assert 'kCGImageDestinationLossyCompressionQuality as String: 0.98' in photo
          assert 'PhotoLibrarySaver.saveJPEG(at: file)' in model
          assert 'confirmedPlan: confirmedPlan' in model
          assert 'pendingExport = ExportProposal(' in model
          for action in ('onSaveToPhotos','onExport'):
              for mode in ('original','safe','economy'):
                  assert f'{action}(.{mode})' in ui
          assert '智能安全分辨率（约 50% 内存预算）' in ui
          assert '省内存分辨率（最高 300 万像素）' in ui
          assert 'os_proc_available_memory' in Path('ios/SpektraFilmPort/SafeExportResolution.swift').read_text()
          assert 'let processHeadroomBytes: UInt64?' in Path('ios/SpektraFilmPort/SafeExportResolution.swift').read_text()
          assert 'validateBeforeRender(plan)' in photo
          print("PASS: explicit original/adaptive/economy for Photos/Files; preflight size+headroom, unchanged 98% JPEG, no fallback")
          PY
      - name: Guard full-size Photos save and double-tap defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("ios/SpektraFilmPort/PhotoProcessor.swift").read_text()
          model = Path("ios/SpektraFilmPort/ContentView.swift").read_text()
          editor = Path("ios/SpektraFilmPort/FloatingEditorWorkspace.swift").read_text()
          saver = Path("ios/SpektraFilmPort/PhotoLibrarySaver.swift").read_text()
          assert '12_500_000' not in source
          assert 'to: workingSource, lut: lut' in source
          assert 'var workingSource = source' in source
          assert 'if resolution != .original' in source
          assert 'SafeExportResolution.capture(' in source
