              --title "SpektraFilm iOS 16.5.1 v1.8.9 — source-order native Metal dye clouds and microstructure" \
              --notes "v1.8.9 adds source Poisson/Binomial samplers and regression with exact stream continuation; retains source MT19937 uniform core and SciPy particle-field GPU density replay (but still does not port NumPy/SciPy sampler sequencing or Numba micro RNG); inherits production global YVV IIR and streaming 3-layer dye clouds, plus measured hardware reference tests. Existing source-law particle pipeline retained. Previous v1.8 description: 3 measured film H-D emulsion sublayers, source Poisson thinning, per-layer/channel dye-cloud blur sigma=sqrt(ODparticle) and real reflect-boundary Gaussian convolution, source lognormal microstructure activation and 0.2um clumping blur, subtract density minima, final 0.65px film blur, then original paper/scan path. Full-resolution output uses 512px Metal tiles with analytic halo to limit intermediate memory, no resampling. Original mode fails explicitly and NEVER silently degrades; previews render off main thread. Python/NumPy 12 stock/pixel reference vectors and actual Metal reflect-boundary tests check formulas and shader, alongside earlier DIR/optics and native iPhoneOS build. Caveat: SciPy RNG streams vs GPU hash and Float64 vs Float32 rounding are not bit-identical. Existing v1.7 fast grain remains default. Unsigned IPA needs signing. Real iPhone16.5 test still pending." \
              --prerelease
          fi
          # Editing a Release's target_commitish does NOT move an existing
          # lightweight git tag. Pin the real tag ref to the tested commit.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="$GITHUB_SHA" -F force=true
          ACTUAL_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          test "$ACTUAL_TAG" = "$GITHUB_SHA"
          echo "PASS: release asset and real tag point to tested SHA $GITHUB_SHA"
      - name: Reject source Metal certification when native GPU parity failed
        if: always() && (steps.metal_source_gpu.outcome != 'success' || steps.iir_source_gpu.outcome != 'success' || steps.source_replay_gpu.outcome != 'success' || steps.precision_certificate.outcome != 'success')
        run: |
