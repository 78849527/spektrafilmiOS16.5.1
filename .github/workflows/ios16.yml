name: iOS 16 — unsigned IPA
on:
  push:
    branches: [ios16]
    paths:
      - 'ios/**'
      - '.github/workflows/ios16.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Stage exact upstream spectral profiles and license files
        run: python3 ios/scripts/stage_profiles.py
      - name: Verify bundled data byte-for-byte against upstream
        run: python3 ios/scripts/validate_profiles.py
      - name: Generate project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Compile unsigned device release
        run: |
          xcodebuild -project ios/SpektraFilmPort.xcodeproj \
            -scheme SpektraFilmPort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify device app and bundled profiles
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app
          test -f "$APP/SpektraFilmPort"
          /usr/libexec/PlistBuddy -c "Print MinimumOSVersion" "$APP/Info.plist" | grep -Eq '^16(\.0)?$'
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist" | grep -q '^com.twogou.spektrafilmport$'
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist" | grep -q '^0.2.1$'
          test -s "$APP/Resources/profiles/index.json"
          test -s "$APP/Resources/profiles/kodak_portra_400.json"
          test -s "$APP/Resources/profiles/kodak_portra_endura.json"
          test -s "$APP/Resources/licenses/SPEKTRAFILM_LICENSE.txt"
          python3 - "$APP" <<'PY'
          import json, pathlib, sys
          app = pathlib.Path(sys.argv[1])
          index = json.loads((app / "Resources/profiles/index.json").read_text())
          assert len(index["profiles"]) >= 20
          assert any(p["id"] == "kodak_portra_400" for p in index["profiles"])
          assert any(p["id"] == "kodak_portra_endura" for p in index["profiles"])
          print("App bundle original spectral data verified")
          PY
      - name: Package unsigned v0.2.1 IPA
        run: |
          mkdir -p ios/build/package/Payload
          cp -R ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app ios/build/package/Payload/
          cd ios/build/package
          zip -q -r ../SpektraFilmPort-ios16-v0.2.1-unsigned.ipa Payload
      - name: Upload unsigned v0.2.1 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpektraFilmPort-ios16-v0.2.1-unsigned
          path: ios/build/SpektraFilmPort-ios16-v0.2.1-unsigned.ipa
          if-no-files-found: error
      - name: Publish v0.2.1 prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/ios16'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=ios/build/SpektraFilmPort-ios16-v0.2.1-unsigned.ipa
          TAG=ios16-v0.2.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
              --title "SpektraFilm Port iOS 16 v0.2.1 — measured profiles (unsigned)" \
              --notes "Unofficial iOS 16.5.1 test build. Measured profiles and opt-in native stock selection sheet with launch-isolated catalog parsing. Existing .cube import and JPEG export retained. Stock selection is metadata only, not physical rendering. Unsigned IPA needs signing." \
              --prerelease
          fi
