        if: github.event_name == 'push' && github.ref == 'refs/heads/ios16.5.1/source-rgb-parity-v1.8.9' && (steps.metal_source_gpu.outcome != 'success' || steps.iir_source_gpu.outcome != 'success' || steps.source_replay_gpu.outcome != 'success' || steps.precision_certificate.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ios1651-v1.8.9-metal-UNVERIFIED-TEST
          SOURCE=ios/build/SpektraFilmPort-iOS16.5.1-v1.8.9-original-metal-unsigned.ipa
          ASSET=ios/build/SpektraFilmPort-iOS16.5.1-v1.8.9-EXPERIMENTAL-UNVERIFIED-unsigned.ipa
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/ios16.5.1/source-rgb-parity-v1.8.9" --jq '.object.sha')
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping stale experimental binary (head=$CURRENT_HEAD)"
            exit 0
          fi
          cp "$SOURCE" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
              --title "TEST ONLY | SpektraFilm iOS 16.5.1 v1.8.9 - SOURCE RGB STAGE DIAGNOSTICS" \
              --notes "WARNING: EXPERIMENTAL TEST BUILD. v1.8.9 adds stage-resolved Python Float64 XYZ/linear RGB/compressed RGB/final sRGB comparisons to isolate source scanner deviations. Earlier v1.8.8 introduced POSITIVE direct spectral scanner vectors: measured 81-wavelength stock densities -> XYZ -> source optional ACES RGC -> encoded sRGB. Swift compares four stages for 24 source cases x 3 channels with per-stage MAE/RMSE/max/worst-case; CI additionally probes whether the Metal GPU can write a constant before asserting shader parity; deviations are EXPLICIT, report is an experimental appendix and does not increase the certified 8/8 count. It is NOT full RAW/negative->paper/Numba grain/complete RGB/JPEG parity. Prior v1.8.7 adaptive 50% user-confirmed memory-based output, <=3MP economy mode, source microstructure deterministic transform remain intact. No silent approximation or fallback. Real iPhone diagnostic and export still required. Unsigned TEST IPA requires signing." \
              --prerelease
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="$GITHUB_SHA" -F force=true
          ACTUAL=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          test "$ACTUAL" = "$GITHUB_SHA"
          gh release view "$TAG" --json tagName,url
          echo "TEST ONLY: signed install needed; no certified source parity."
      - name: Publish isolated v1.8.9 prerelease and synchronize tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/ios16.5.1/source-rgb-parity-v1.8.9' && steps.metal_source_gpu.outcome == 'success' && steps.iir_source_gpu.outcome == 'success' && steps.source_replay_gpu.outcome == 'success' && steps.precision_certificate.outcome == 'success'
        env:
