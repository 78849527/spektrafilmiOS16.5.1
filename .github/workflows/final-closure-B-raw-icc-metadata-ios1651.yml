name: Acceptance B - source RAW signature, original ICC actual disk files, metadata gaps (NO IPA)
on:
  push:
    branches:
      - acceptance/final-closure-B-raw-icc-metadata-ios1651
    paths:
      - ios/tests/FinalSource*
      - ios/scripts/final_closure_B_*
      - .github/workflows/final-closure-B-raw-icc-metadata-ios1651.yml
      - docs/FINAL-CLOSURE-B-RAW-ICC-METADATA.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-native-evidence:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source-scoped acceptance, no code changed
        run: |
          python3 ios/scripts/final_closure_B_raw_icc_audit.py /tmp/final-B.json
      - name: RAW signatures, 12 spoofs, original bytes SHA256
        run: |
          set -euo pipefail
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build79RAWSignature.swift \
            ios/SpektraFilmPort/Build79RAWStorage.swift \
            ios/SpektraFilmPort/Build79NativeRAWBackend.swift \
            ios/tests/Build79RAWSignatureValidation.swift \
            ios/tests/FinalSourceRawPreservationValidation.swift \
            -o /tmp/FinalRawEvidence
          /tmp/FinalRawEvidence
      - name: Generate five original source ICC profiles from pinned io.py
        run: |
          python3 ios/scripts/build90_generate_original_icc.py
      - name: Native macOS JPEG PNG TIFF U8 U16 F32 ICC exact file readback
        run: |
          set -euo pipefail
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build90GeneratedSourceICC.swift \
            ios/SpektraFilmPort/Build90SourceOutputQuantization.swift \
            ios/SpektraFilmPort/Build90NativeOutputWriter.swift \
            ios/SpektraFilmPort/Build90OriginalICCContainer.swift \
            ios/tests/Build90NativeImageIOValidation.swift \
            -o /tmp/FinalImageIOEvidence
          /tmp/FinalImageIOEvidence
      - name: Source EXIF IPTC GPS metadata actual JPEG/TIFF disk roundtrip
        continue-on-error: true
        run: |
          set -euo pipefail
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build90GeneratedSourceICC.swift \
            ios/SpektraFilmPort/Build90SourceOutputQuantization.swift \
            ios/SpektraFilmPort/Build90NativeOutputWriter.swift \
            ios/SpektraFilmPort/Build90OriginalICCContainer.swift \
            ios/tests/FinalSourceMetadataRoundTripValidation.swift \
            -o /tmp/FinalSourceMetadata
          /tmp/FinalSourceMetadata
          touch /tmp/final-metadata-actually-passed
      - name: Update metadata scope in evidence JSON (NO formal certification)
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/final-B.json')
          if p.exists():
              d=json.loads(p.read_text())
              d['EXIF_IPTC_GPS']=('MACOS_REAL_JPEG_TIFF_PASSED'
                if Path('/tmp/final-metadata-actually-passed').exists()
                else 'BLOCKED_REAL_METADATA_ROUNDTRIP_FAILED_OR_NOT_RUN')
              d['formalCertificate']=False
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
              print('Metadata acceptance:',d['EXIF_IPTC_GPS'])
          PY
      - name: Archive honest evidence classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Acceptance-B-original-RAW-ICC-evidence-not-certified
          path: /tmp/final-B.json
          if-no-files-found: warn
