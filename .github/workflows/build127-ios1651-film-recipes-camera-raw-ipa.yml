name: Build127 iOS16.5.1 film and recipe carousel with default native RAW IPA

on:
  push:
    branches:
      - 'work/build127-film-recipes-carousel-camera-raw-default-ios1651'
    paths:
      # Batch only: source-file commits must NOT start another Xcode build.
      # Re-run explicitly via workflow_dispatch after multi-module changes.
      - '.github/workflows/build127-ios1651-film-recipes-camera-raw-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest explicit CI trigger should claim a macOS runner.
concurrency:
  group: build127-ios1651-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A separate public-repository Ubuntu runner tests whether runner
  # provisioning works at all, before spending time in the macOS queue.
  # Failure to start both runners is an Actions/account-level blocker,
  # not a Swift compile diagnostic.
  runner-preflight:
    name: Linux runner + Build123 iOS16.5 Bayer RAW exception and staged diagnostics contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Linux runner acquired and audit source before macOS
