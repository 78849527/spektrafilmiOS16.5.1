          # Fail-fast all carried-forward Build103/Build100 UI invariants before Mac source generation.
          python3 ios/scripts/build103_device_metrics_audit.py /tmp/build115-early-ui-audit.json
          python3 ios/scripts/build111_photo_input_audit.py
          python3 ios/scripts/final_gamut_source_route_audit.py
          python3 ios/scripts/build110_source_gamut_device_audit.py
          python3 -m compileall -q ios/scripts
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'ios/scripts')
          from build_ci_version_floor import minimum_build, minimum_minor
          project=Path('ios/project.yml').read_text()
          assert minimum_build(project,127)
          assert minimum_minor(project,93)
          assert not minimum_build(project,128)
          assert not minimum_minor(project,94)
          print('PASS current 1.8.93/127 and all carried-forward minimum release contracts')
          PY
          git diff --exit-code

  group-compile-once:
    needs: runner-preflight
    # Required by AGENTS.md: Apple Silicon macOS 15 (verified full Build112 baseline).
    # Never switch to Intel or macos-latest without explicit user approval.
    # iPhoneOS arm64 target, minimum iOS 16.5 / iOS 16.5.1 compatibility.
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout exact bulk source revision
        uses: actions/checkout@v4
      - name: Use Xcode iPhoneOS SDK and report real source SHA
        run: |
