          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS RUNNER_NAME=$RUNNER_NAME SHA=$GITHUB_SHA"
          python3 ios/scripts/build115_unseeded_parallel_source_audit.py
          python3 ios/scripts/build116_grain_memory_matrix_audit.py
          python3 ios/scripts/build117_dynamic_memory_audit.py
          python3 ios/scripts/build118_separate_large_memory_audit.py
          python3 ios/scripts/build119_committed_memory_audit.py
          python3 ios/scripts/build120_process_ui_restructure_audit.py
          python3 ios/scripts/build121_switch_explanation_audit.py
          python3 ios/scripts/build122_compact_native_camera_audit.py
          python3 ios/scripts/build123_native_raw_capture_safety_audit.py
          python3 ios/scripts/build124_native_dng_editor_ingress_audit.py
          python3 ios/scripts/build125_raw_8bit_transport_audit.py
          python3 ios/scripts/build126_recipe_system_audit.py
