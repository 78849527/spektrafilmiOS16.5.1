      - name: Upload Build111 input color-profile plus old four-mode experimental unsigned IPA and source tapes
        if: ((github.event_name == 'workflow_dispatch' && inputs.publish_ipa == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[device-ipa:147]')))
        uses: actions/upload-artifact@v4
        with:
          name: Build147-1.8.113-arm64-optimization-unsigned-unverified
          path: |
            ios/build/release/*.ipa
            ios/build/release/*.sha256
            ios/build/release/verification-build147.json
            ios/build/release/build114-four-gate-certification-ledger.json
            ios/build/release/build114-unseeded-numba-source-statistics.json
            ios/build/release/build115-swift-parallel-stats.json
            ios/build/release/build115-python-swift-parallel-statistics.json
            /tmp/build92-real-source-48-stage-tapes.json
