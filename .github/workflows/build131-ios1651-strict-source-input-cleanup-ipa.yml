          assert 'onRunOptimizationFullDensityReuse' in ui and 'runFullDensityReuseComparison' in editor
          candidate=ingress.split('static func runFullDensityReuseComparison(',1)[1].split('/// Build139:',1)[0]
          assert 'additionalBytesPerPixel:envelope.additionalBytesPerPixel+24' in candidate
          assert 'didReceiveMemoryWarningNotification' in candidate and 'defer {session.clear()}' in candidate
          assert 'cold.digest==baseline.digest' in candidate and 'hot.digest==baselineChanged.digest' in candidate
          assert 'hot.hit' in candidate and 'productionEnabled":"false"' in candidate
          assert 'Float64 胶片密度缓存对照' in ui
          assert 'sampledPeakPhysicalFootprintBytes' in feedback
          assert 'try OPTDeviceFeedback.export()' in editor
          assert '导出性能反馈 JSON' in ui
          assert 'options:.atomic' in feedback and 'events.count>160' in feedback
          print('PASS OPT actual editor event journal and one-tap local JSON sharing source contract')
          PY
