          if-no-files-found: error
      - name: Publish ONLY experimental unsigned Build131 IPA after successful true iPhoneOS compile
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.publish_ipa == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[device-ipa:147]')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=work/build129-raw-float32-srgb-icc-admission-ios1651
          TAG="ios1651-v1.8.113-build147-optimization-${GITHUB_SHA:0:12}-UNSIGNED-UNVERIFIED"
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" -q '.object.sha')"
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::error::Release forbidden: latest branch $HEAD differs from tested $GITHUB_SHA"
            exit 1
          fi
          ASSET=ios/build/release/SpektraFilm-1.8.113-Build147-iOS16.5.1-UNSIGNED-UNVERIFIED.ipa
          SUM="$ASSET.sha256"
          ID=ios/build/release/verification-build147.json
          NOTES='Build147 v1.8.113/147 iPhoneOS arm64 deployment 16.5. Consolidates Build147-A reduced no-grain preview density reuse, Build147-B seeded pre-grain cache diagnostics, Build147-C in-place grain Gaussian, dead rates scratch borrowing and prepared Float64 lognormal, and Build147-D isolated actual full-size RAW no-grain density cache SHA256 comparison. Production full-resolution cache and seeded grain cache remain disabled. Original RNG, Float64, serial engine, reference FFT, geometry and dynamic memory admission unchanged. Host gates do not establish physical A15 timing, memory or RAW Python parity. UNSIGNED IPA requires external signing.'
          # Keep earlier Build136 release immutable. A rerun for this exact
          # SHA leaves its existing assets untouched instead of clobbering.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release for this SHA already exists, preserving assets."
            exit 0
          fi
          gh release create "$TAG" "$ASSET" "$SUM" "$ID" \
            --target "$GITHUB_SHA" --prerelease \
