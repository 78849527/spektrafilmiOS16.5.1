          python3 ios/scripts/build111_photo_input_audit.py
          python3 ios/scripts/final_gamut_source_route_audit.py
          python3 ios/scripts/build110_source_gamut_device_audit.py
          python3 -m compileall -q ios/scripts
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'ios/scripts')
          from build_ci_version_floor import minimum_build, minimum_minor
          project=Path('ios/project.yml').read_text()
          assert minimum_build(project,147)
          assert minimum_minor(project,113)
          assert not minimum_build(project,148)
          assert not minimum_minor(project,114)
          print('PASS current 1.8.113/147, exact processing defaults and all RAW source/crop contracts')
          PY
          git diff --exit-code
      - name: Build136 source io.py and Swift Float16/32 exact bytes on Linux
        run: |
          set -euo pipefail
          # Apple x86_64 macOS Swift cannot instantiate Float16, while
          # the iPhoneOS arm64 app build uses its native Float16 path.
          # Execute real source quantization plus native Swift6 F16 on Linux.
          command -v swiftc
          swiftc --version
          python3 -m venv /tmp/build136-oiio-venv
          /tmp/build136-oiio-venv/bin/python -m pip install \
            --disable-pip-version-check --quiet 'numpy==1.26.4'
          /tmp/build136-oiio-venv/bin/python \
            ios/scripts/build90_original_io_quantization_oracle.py \
            /tmp/build90-oiio-source-frozen.json
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build90SourceOutputQuantization.swift \
            ios/tests/Build90SourceIOQuantizationValidation.swift \
            -o /tmp/build136-source-byte-parity
          /tmp/build136-source-byte-parity /tmp/build90-oiio-source-frozen.json

  group-compile-once:
    needs: runner-preflight
    # Owner decision: any macOS host architecture is allowed.
    # Apple Silicon preferred; Intel remains an explicit manual option.
    # Only host changes. The compiled iPhoneOS arm64 target, Xcode, original
    # optical sources, versions, RNG and parity tests remain unchanged.
    # A single explicit push marker can retry a cancelled hosted arm64 runner
    # on Intel without changing future default or iPhoneOS target architecture.
    runs-on: ${{ inputs.macos_runner || (github.event_name == 'push' && contains(github.event.head_commit.message, '[runner:intel]') && 'macos-15-intel' || 'macos-15') }}
    timeout-minutes: 55
    steps:
      - name: Checkout exact bulk source revision
        uses: actions/checkout@v4
      - name: Use Xcode iPhoneOS SDK and report real source SHA
        run: |
          # Host CPU does not decide the iPhoneOS app's architecture.
          case "$(uname -m)" in x86_64|arm64) ;; *) echo "::error::Unsupported macOS host"; exit 1 ;; esac
          sudo xcode-select -s /Applications/Xcode_16.4.app
          test -d "$(xcode-select -p)"
          xcodebuild -version | grep -F 'Xcode 16.4'
          echo "Host $(uname -m): cross-compiling iPhoneOS arm64; algorithms unchanged"
          xcodebuild -version
          git rev-parse HEAD
      - uses: actions/setup-python@v5
