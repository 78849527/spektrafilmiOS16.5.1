name: Build147 optimization regression and explicitly requested device IPA

on:
  push:
    branches:
      - 'work/build129-raw-float32-srgb-icc-admission-ios1651'
    paths:
      # One consolidated validation after the optimization batch.
      # Package on manual opt-in or exact explicit Build147 commit marker only.
      - '.github/workflows/build131-ios1651-strict-source-input-cleanup-ipa.yml'
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "macOS build host (App target remains iPhoneOS arm64)"
        required: false
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - macos-latest
      publish_ipa:
        description: "Package/publish current versioned candidate only when explicitly requested"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Only the newest explicit CI trigger should claim a macOS runner.
concurrency:
  group: build131-ios1651-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A separate public-repository Ubuntu runner tests whether runner
  # provisioning works at all, before spending time in the macOS queue.
  # Failure to start both runners is an Actions/account-level blocker,
  # not a Swift compile diagnostic.
  runner-preflight:
    name: Linux runner + Build123 iOS16.5 Bayer RAW exception and staged diagnostics contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Linux runner acquired and audit source before macOS
        run: |
          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS RUNNER_NAME=$RUNNER_NAME SHA=$GITHUB_SHA"
          python3 ios/scripts/run_common_source_audits.py
          python3 ios/scripts/p1_original_raw_aces_source_audit.py
          python3 ios/scripts/p1_hanatos_aces_source_audit.py
          python3 ios/scripts/p1_direct_raw_production_audit.py
          python3 ios/scripts/build133_raw_memory_stage_audit.py
          python3 ios/scripts/build134_raw_cleanup_ui_audit.py
          python3 ios/scripts/raw_gallery_source_audit.py
          python3 ios/scripts/build138_raw_defaults_thumbnail_audit.py
          python3 ios/scripts/build139_raw_fast_preview_audit.py
          python3 ios/scripts/build140_raw_all_options_audit.py
          python3 ios/scripts/build141_raw_pre_crop_audit.py
          python3 ios/scripts/build142_factory_defaults_audit.py
          python3 ios/scripts/build135_dynamic_memory_admission_audit.py
          python3 ios/scripts/build136_memory_constants_audit.py
