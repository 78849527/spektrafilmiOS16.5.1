          # device diagnostic routes. Require each explicitly; no count-only waiver.
          assert editor.count('P1OriginalRawACESIngress.withExclusiveRAWWork(operation:')==7
          assert 'withExclusiveRAWWork(operation:fullSourcePreview ? "full_preview" : "quick_preview")' in editor
          for operation in ('jpeg_export','tiff16_export','fft_device_compare','parallel_device_compare','density_reuse_device_compare','full_density_reuse_device_compare'):
              assert editor.count('withExclusiveRAWWork(operation:"'+operation+'")')==1, operation
