      - name: Build104 on-device diagnostic source and manifest/static integration
        run: |
          set -euo pipefail
          test -s ios/SpektraFilmPort/Build104DeviceGrainEvidence.swift
          test -s ios/verification/generated-source-grain-v1.8.48/fast_stats_no_micro.final.f64le
