# Retry Build115 on the original development branch; single active attempt, unchanged Swift implementation.
# Build115 final pinned test-and-release trigger after parallel grain source batch
# Final source includes worker state + production 3x3 grain + UI/diagnostic + memory ledger + Python/Swift cross checks.
# Full-size Python, RAW/ICC and arbitrary unseeded prange bitstream remain explicitly NOT CERTIFIED.
# Build114 UI-only. Starts from the previously PASS Build111 CI and only changes version/UI verification/release identity.
# Follow-up: scan XYZ single-thread control moved to Process/Scanner; CMY to Process/Paper; Build100 audit updated for original advanced controls.
# Build111 fix: ship compatibility changes via the existing Build110 release branch, no extra release branch.
# Build111 fast fail: real tagged P3/JPEG ColorSync fixture executes before original source generation.
# Build111 Swift parser fix: use one interpolated accessibility label, preserving iOS16.5.1 behavior.
# Build111 release source after preserving original Build78 16-bit PNG/TIFF and Float TIFF inputs.
# Build108 audit follow-up: check the actual SwiftUI callback name independently of the ContentView method name.
# Build108: syntax-only preflight cannot read generated original Python manifests before generator runs.
# Build108: CI against actual 1MP/2MP CPU Float64 optical production + Build106/107 combined on-device feedback.
# Build107: same-source Build106 memory lifecycle + Build107 bounded RSS; single LOG+JSON truth-telling release.
# Build107 source gate (carried-forward): source grain conditional missing-seed diagnostic hotfix; original algorithms unchanged.
# Build104 retry: fix diagnostic Swift multiline infix source parser error, verified with swiftc -frontend -parse.
# Build101 retry: corrected Swift XCTest-host equality parser newline.
# Build98 minimal Xcode Swift concurrency fix: @MainActor FastSettingsSnapshot.
# Build102: fix real iPhone Build101 first failure caused by skipped colour-science
# Float64 sRGB-to-sRGB matrix in the legacy scanner diagnostic expectation.
# Production optical pipeline/tolerances remain exactly unchanged.
name: Build115 source Numba unseeded multiworker grain and iOS16.5.1 IPA

on:
  push:
    branches:
      - 'work/build114-four-certification-gates-ios1651'
    paths:
      # Batch only: source-file commits must NOT start another Xcode build.
      # Re-run explicitly via workflow_dispatch after multi-module changes.
      - '.github/workflows/build115-numba-unseeded-multiworker-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest explicit CI trigger should claim a macOS runner.
concurrency:
  group: build115-ios1651-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A separate public-repository Ubuntu runner tests whether runner
  # provisioning works at all, before spending time in the macOS queue.
  # Failure to start both runners is an Actions/account-level blocker,
  # not a Swift compile diagnostic.
  runner-preflight:
    name: Linux runner + Build115 source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Linux runner acquired and audit source before macOS
        run: |
          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS RUNNER_NAME=$RUNNER_NAME SHA=$GITHUB_SHA"
          python3 ios/scripts/build115_unseeded_parallel_source_audit.py
          python3 -m py_compile ios/scripts/build115_compare_parallel_moments.py ios/scripts/build114_unseeded_numba_statistical_gate.py
          git diff --exit-code

  group-compile-once:
    needs: runner-preflight
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout exact bulk source revision
        uses: actions/checkout@v4
      - name: Use Xcode iPhoneOS SDK and report real source SHA
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build108 immediate Swift syntax gate for 1MP/2MP real renderer and source UI
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse \
            ios/SpektraFilmPort/Build108SourceOpticalDeviceStress.swift \
            ios/SpektraFilmPort/Build107CombinedDeviceFeedback.swift \
          ios/SpektraFilmPort/SourceSpatialDIRConvolution.swift \
            ios/SpektraFilmPort/ContentView.swift \
            ios/SpektraFilmPort/FloatingEditorWorkspace.swift
          # Python audit needs generated original-source manifest, checked
          # in the next source-reference step after original fixture generation.
      - name: Build114 process/optics UI and safe-memory preflight
        run: |
          set -euo pipefail
          python ios/scripts/build112_ui_only_audit.py
          swiftc -frontend -parse \
            ios/SpektraFilmPort/FloatingEditorWorkspace.swift \
            ios/SpektraFilmPort/ContentView.swift
          git fetch --no-tags --depth=1 origin c02d84b54f5c7f384eb256ac4ca2f01d1a0b214c
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only',
            'c02d84b54f5c7f384eb256ac4ca2f01d1a0b214c','HEAD'],text=True).splitlines()
          forbidden=[x for x in changed if x.startswith('ios/SpektraFilmPort/')
            and x.endswith('.swift')
            and x not in {
                'ios/SpektraFilmPort/FloatingEditorWorkspace.swift',
                'ios/SpektraFilmPort/SafeExportResolution.swift',
                'ios/SpektraFilmPort/ContentView.swift',
                'ios/SpektraFilmPort/OriginalSourcePhysicalImage.swift',
                'ios/SpektraFilmPort/SourceSpatialDIRConvolution.swift',
                'ios/SpektraFilmPort/Build108SourceOpticalDeviceStress.swift',
                'ios/SpektraFilmPort/OriginalSourcePhysicalGrain.swift',
                'ios/SpektraFilmPort/OriginalSourceNumbaParallelWorkers.swift',
                'ios/SpektraFilmPort/Build115ParallelNumbaEvidence.swift',
                'ios/SpektraFilmPort/Build106SourceMemoryLedger.swift'
              }]
          assert not forbidden, 'Build115 unexpectedly changed unapproved original modules: '+str(forbidden)
          print('PASS Build115 scoped original parallel stochastic work with strictly separate controlled seed mode')
          PY

      - name: Build115 source parallel original-grain production contract and Swift syntax
        run: |
          set -euo pipefail
          python ios/scripts/build115_unseeded_parallel_source_audit.py
          swiftc -frontend -parse \
            ios/SpektraFilmPort/OriginalSourceNumbaParallelWorkers.swift \
            ios/SpektraFilmPort/OriginalSourcePhysicalGrain.swift \
            ios/SpektraFilmPort/Build115ParallelNumbaEvidence.swift \
            ios/SpektraFilmPort/ContentView.swift \
            ios/SpektraFilmPort/FloatingEditorWorkspace.swift

      - name: Build114 deterministic 1300MB safe output and late headroom rejection
        run: |
          set -euo pipefail
          swiftc -parse-as-library -O \
            ios/SpektraFilmPort/SafeExportResolution.swift \
            ios/tests/SafeExportResolutionValidation.swift \
            -o /tmp/Build114SafeExportValidation
          /tmp/Build114SafeExportValidation

      - name: Build114 bit-exact original FIR/YVV versus in-place all channel full-frame regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path('ios/SpektraFilmPort/SourceSpatialDIRConvolution.swift').read_text()
          assert 'func diffuseInPlaceMemoryBounded(' in source
          old=source.split('    /// Original 2D RGB per-channel Gaussian',1)[0]
          old=old.replace('import CoreImage\n','').replace('import CoreGraphics\n','')
          Path('/tmp/Build114DIRCore.swift').write_text(old+'\n}\n')
          physical=Path('ios/SpektraFilmPort/OriginalSourcePhysicalImage.swift').read_text()
          assert 'estimatedPeakBytesPerPixel: UInt64 = 112' in physical
          assert 'diffuseInPlaceMemoryBounded(' in physical
          PY
          swiftc -O -parse-as-library \
            /tmp/Build114DIRCore.swift \
            ios/tests/Build114InPlaceDIRValidation.swift \
            -o /tmp/Build114DIRValidation
          /tmp/Build114DIRValidation

      - name: Build111 actual tagged P3 to sRGB ColorSync bytes plus unified image admission audit
        run: |
          set -euo pipefail
          python ios/scripts/build111_photo_input_audit.py
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build111PhotoInputProfile.swift \
            ios/tests/Build111PhotoInputProfileValidation.swift \
            -o /tmp/Build111PhotoInputValidation
          /tmp/Build111PhotoInputValidation
          swiftc -frontend -parse \
            ios/SpektraFilmPort/Build111PhotoInputProfile.swift \
            ios/SpektraFilmPort/ContentView.swift \
            ios/SpektraFilmPort/FloatingEditorWorkspace.swift \
            ios/SpektraFilmPort/Build110SourceGamutDeviceEvidence.swift

      - name: Install original fixture generation source stack
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            'numpy==1.26.4' 'scipy==1.15.3' 'colour-science==0.4.6' \
            'matplotlib==3.10.7' 'numba==0.61.2' 'opt_einsum==3.4.0' \
            'scikit-image==0.25.2'
      - name: Build114 real original Python Numba 4-worker unseeded statistical gate
        env:
          NUMBA_NUM_THREADS: '4'
          NUMBA_THREADING_LAYER: 'workqueue'
        run: |
          set -euo pipefail
          python ios/scripts/build114_unseeded_numba_statistical_gate.py
      - name: Build115 run real Swift 4-worker unseeded Numba distribution, state and Python cross comparison
        run: |
          set -euo pipefail
          # OriginalSourceMT19937.validateReference resolves this generated
          # type at typecheck time; omitting it always breaks this swiftc link.
          python ios/scripts/generate_source_mt19937.py
          test -s ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/OriginalSourceNumbaSingleThreadNormal.swift \
            ios/SpektraFilmPort/OriginalSourceNumbaFastCounts.swift \
            ios/SpektraFilmPort/OriginalSourceNumbaParallelWorkers.swift \
            ios/tests/Build115ParallelNumbaValidation.swift \
            -o /tmp/Build115ParallelNumbaValidation
          BUILD115_PARALLEL_STATS_OUTPUT=ios/build/release/build115-swift-parallel-stats.json \
            /tmp/Build115ParallelNumbaValidation
          python ios/scripts/build115_compare_parallel_moments.py
          test -s ios/build/release/build115-swift-parallel-stats.json
          test -s ios/build/release/build115-python-swift-parallel-statistics.json


      - name: Generate original film, print, scanner, random and physical data
        run: |
          set -euo pipefail
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_camera_batch.py
          python ios/scripts/generate_compact_catalog.py
          python ios/scripts/generate_spectral_data.py
          python ios/scripts/generate_original_optics.py
          python ios/scripts/generate_hanatos.py
          python ios/scripts/generate_build77_stock_halation.py
          python ios/scripts/generate_dir.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_hd_interpolation_reference.py
          python ios/scripts/generate_dir_spatial.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_spatial_dir_2d.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_full_frame.py
          python ios/scripts/generate_sublayer_grain.py
          python ios/scripts/generate_original_metal_grain.py
          python ios/scripts/generate_original_source_rng.py
          python ios/scripts/generate_source_iir.py
          python ios/scripts/generate_source_mt19937.py
          python ios/scripts/generate_original_scipy_rng.py
          python ios/scripts/generate_source_replay.py
          python ios/scripts/generate_source_microstructure.py
          NUMBA_CACHE_DIR="$(mktemp -d)" NUMBA_NUM_THREADS=1 \
            NUMBA_THREADING_LAYER=workqueue \
            python ios/scripts/generate_source_physical_grain.py
          python ios/scripts/generate_source_rgb_parity.py
          python ios/scripts/generate_source_print_scanner_parity.py
          python ios/scripts/generate_source_negative_print_chain.py
          python ios/scripts/generate_source_film_dir_print_chain.py
          python ios/scripts/generate_source_camera_film_print_chain.py
          python ios/scripts/validate_source_float64_original.py
          NUMBA_CACHE_DIR="$(mktemp -d)" NUMBA_NUM_THREADS=1 \
            NUMBA_THREADING_LAYER=workqueue \
            python ios/scripts/generate_source_physical_frame.py
          python ios/scripts/generate_build77_rgb_pre_original.py
          python ios/scripts/generate_scanner_reference.py
          python ios/scripts/build90_generate_original_icc.py
          python ios/scripts/generate_cam16_gamut.py
          python ios/scripts/generate_print_morph.py
          python ios/scripts/generate_print_optics.py
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
          test -s ios/SpektraFilmPort/GeneratedSourceReplayReference.swift
          test -s ios/SpektraFilmPort/GeneratedMeasuredProfiles.swift
          test -s ios/SpektraFilmPort/GeneratedDIRData.swift
      - name: Independent Python original Oklch 96, actual TC LUT 4038, CAM16 216 numerical parity
        run: |
          set -euo pipefail
          python ios/scripts/build81_generate_source_locus.py --output ios/SpektraFilmPort/Build81GeneratedSpectralLocus.swift
          python ios/scripts/final_source_oklch_oracle.py --output /tmp/build109-original-oklch.json
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build81OriginalInputGamut.swift \
            ios/SpektraFilmPort/Build81GeneratedSpectralLocus.swift \
            ios/tests/FinalSourceOklchValidation.swift -o /tmp/Build109Oklch
          /tmp/Build109Oklch /tmp/build109-original-oklch.json
          python ios/scripts/final_source_tc_lut_oracle.py /tmp/build109-original-tc.json
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/Build81OriginalInputGamut.swift \
            ios/SpektraFilmPort/Build81GeneratedSpectralLocus.swift \
            ios/SpektraFilmPort/Build82OriginalHanatosSurface.swift \
            ios/SpektraFilmPort/Build82OriginalSpectralRuntime.swift \
            ios/tests/FinalOriginalTCLUTValidation.swift -o /tmp/Build109TC
          /tmp/Build109TC /tmp/build109-original-tc.json
          python ios/scripts/build89_real_cam16_original_oracle.py /tmp/build109-original-cam16.json
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/Build89OriginalCAM16.swift \
            ios/tests/Build89NativeSourceCAM16Validation.swift -o /tmp/Build109CAM16
          /tmp/Build109CAM16 /tmp/build109-original-cam16.json
          python ios/scripts/final_gamut_source_route_audit.py
      - name: Build110 real device four-mode report, source and UI integration contract
        run: |
          set -euo pipefail
          python ios/scripts/build110_source_gamut_device_audit.py
          swiftc -frontend -parse \
            ios/SpektraFilmPort/Build110SourceGamutDeviceEvidence.swift \
            ios/SpektraFilmPort/ContentView.swift \
            ios/SpektraFilmPort/FloatingEditorWorkspace.swift
      - name: Build107 source gate (carried-forward) validate previous device false-failure against 4 real Python original fixtures
        run: |
          set -euo pipefail
          python ios/scripts/build108_feedback_source_audit.py
      - name: Build107 independently validate Build106 24 memory matrix and shared production ledger
        run: |
          set -euo pipefail
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/Build106SourceMemoryLedger.swift \
            ios/tests/Build106SourceMemoryLedgerValidation.swift \
            -o /tmp/Build107SourceMemoryLedger
