name: Build77 batched original source verification (NO IPA)

on:
  push:
    branches:
      - port/build77-source-contract-01-05
    paths:
      - "ios/scripts/build77_source_contract.py"
      - "ios/scripts/build77_candidate_tape_selftest.py"
      - "ios/scripts/build77_params_digest_reference.py"
      - "ios/scripts/generate_build77_rgb_pre_original.py"
      - "ios/scripts/generate_hanatos.py"
      - "ios/SpektraFilmPort/OriginalHanatosResponse.swift"
      - "ios/tests/SpectralValidation.swift"
      - "ios/scripts/build77_measured_manifest.py"
      - "ios/scripts/generate_spectral_data.py"
      - "ios/scripts/generate_original_optics.py"
      - "ios/tests/Build77MeasuredProfileAudit.swift"
      - "ios/SpektraFilmPort/SpectralPhysics.swift"
      - "ios/SpektraFilmPort/OriginalSourcePhysicalImage.swift"
      - "ios/tests/SourcePhysicalImageParity.swift"
      - "ios/project.yml"
      - "ios/SpektraFilmPort/Build77StageTapeRecorder.swift"
      - "ios/scripts/generate_build77_stock_halation.py"
      - "ios/SpektraFilmPort/Build77StockHalation.swift"
      - "ios/SpektraFilmPort/ContentView.swift"
      - "ios/SpektraFilmPort/OriginalSourceFilmHalation.swift"
      - "ios/SpektraFilmPort/OriginalPrintOptics.swift"
      - "ios/SpektraFilmPort/FloatingEditorWorkspace.swift"
      - "ios/tests/Build77NeutralFilterParity.swift"
      - "ios/tests/SourceFloat64ProfileValidation.swift"
      - "ios/tests/Build77StockHalationParity.swift"
      - "ios/SpektraFilmPort/Build77OriginalParameterDigest.swift"
      - "ios/SpektraFilmPort/Build77ExactJSONValue.swift"
      - "ios/tests/Build77OriginalParameterDigestValidation.swift"
      - "ios/tests/Build77StageTapeRecorderValidation.swift"
      - "src/spektrafilm/**"
      - "pyproject.toml"
      - ".github/workflows/build77-source-contract.yml"
  workflow_dispatch:

# Keep only the newest batched test run for the active migration branch.
concurrency:
  group: build77-batched-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upstream-contract:
    name: Python source / 28 profiles / topology / schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Fast static Swift parse of changed production stage boundaries
        run: |
          swiftc -frontend -parse \
            ios/SpektraFilmPort/SpectralPhysics.swift \
            ios/SpektraFilmPort/OriginalSourcePhysicalImage.swift \
            ios/SpektraFilmPort/Build77StageTapeRecorder.swift \
            ios/tests/SourcePhysicalImageParity.swift
      - name: Python 3.13 (upstream requires ~=3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and self-test the independent harness
        run: |
          python -m py_compile ios/scripts/build77_source_contract.py
          python ios/scripts/build77_source_contract.py self-test
      - name: Verify pinned upstream blobs and emit JSON evidence
        run: |
          python ios/scripts/build77_source_contract.py verify --report build77-evidence/source-contract.json
      - name: Retain report (source contract only, not iOS parity)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-source-contract
          path: build77-evidence/source-contract.json
          if-no-files-found: warn

  python-reference-taps:
    name: Python 3.13 original seven-tap evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install original Python runtime numerical libraries
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy~=2.4" "scipy~=1.17" "colour-science~=0.4.6" \
            "scikit-image~=0.26" "opt-einsum~=3.4.0" \
            "numba~=0.64" "pyfftw~=0.15.0" "matplotlib~=3.10" \
            "OpenImageIO~=3.1.11" "rawpy~=0.26.1" \
            "exiv2~=0.18.1" "lensfunpy~=1.18.0"
          python -m pip install --no-deps -e .
      - name: Create a fixed tiny RGB input, without seeding original runtime RNG
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          Path("build77-evidence").mkdir(exist_ok=True)
          rng = np.random.default_rng(771)
          image = 0.15 + 0.55*rng.random((6, 4, 3))
          np.save("build77-evidence/input.npy", image, allow_pickle=False)
          PY
      - name: Execute the real upstream negative-to-print pipeline once
        run: |
          python ios/scripts/build77_source_contract.py emit-taps \
            --input build77-evidence/input.npy \
            --output build77-evidence/negative-print \
            --film kodak_portra_400 --paper kodak_portra_endura
      - name: Execute the real upstream reversal/direct-scan pipeline once
        run: |
          python ios/scripts/build77_source_contract.py emit-taps \
            --input build77-evidence/input.npy \
            --output build77-evidence/direct-scan \
            --film fujifilm_provia_100f --paper kodak_portra_endura --scan-film
      - name: Execute upstream Python source 2D optical paper diffusion branch
        run: |
          python ios/scripts/build77_source_contract.py emit-taps \
            --input build77-evidence/input.npy \
            --output build77-evidence/negative-print-diffusion \
            --film kodak_portra_400 --paper kodak_portra_endura \
            --print-diffusion
      - name: Verify reference tape serialization and comparator
        run: |
          python ios/scripts/build77_source_contract.py compare-taps \
            --reference build77-evidence/negative-print \
            --candidate build77-evidence/negative-print --atol 0
          python ios/scripts/build77_source_contract.py compare-taps \
            --reference build77-evidence/direct-scan \
            --candidate build77-evidence/direct-scan --atol 0
          python ios/scripts/build77_source_contract.py compare-taps \
            --reference build77-evidence/negative-print-diffusion \
            --candidate build77-evidence/negative-print-diffusion --atol 0
      - name: Verify 5/7 original Python-to-iOS candidate comparator (synthetic harness only)
        run: |
          python -m py_compile ios/scripts/build77_candidate_tape_selftest.py
          python ios/scripts/build77_candidate_tape_selftest.py
      - name: Capture exact upstream Python RuntimePhotoParams digest (360 cases)
        run: |
          python ios/scripts/build77_params_digest_reference.py \
            --output build77-evidence/parameter-digest.json
      - name: Preserve original stage tape bytes and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-python-original-taps-not-swift-certified
          path: build77-evidence/
          if-no-files-found: warn

  ios-stage-recorder:
    name: Actual Swift Double tape + unsigned iPhoneOS compile
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 16.5-compatible Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Compile/run actual Swift stage recorder host test
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/Build77StageTapeRecorder.swift \
            ios/tests/Build77StageTapeRecorderValidation.swift \
            -o /tmp/Build77StageTapeRecorderValidation
          mkdir -p build77-evidence/swift
          /tmp/Build77StageTapeRecorderValidation build77-evidence/swift
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Swift output with independent NumPy NPY decoder
        run: |
          python -m pip install --disable-pip-version-check "numpy~=2.4"
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          directory=Path("build77-evidence/swift")
          manifest=json.loads((directory/"manifest.json").read_text())
          assert manifest["status"] == "IOS_INTERNAL_DIAGNOSTIC_NOT_PYTHON_TAP_PARITY"
          raw=np.load(directory/"logRaw.npy",allow_pickle=False)
          ev=np.load(directory/"cameraAutoExposureEV.npy",allow_pickle=False)
          assert raw.dtype == np.dtype("<f8") and raw.shape == (1,2,3)
          assert raw[0,0,:].tolist() == [0.125,-1.0,0.25]
          assert np.isposinf(raw[0,1,0]) and np.isnan(raw[0,1,1])
          assert raw[0,1,2] == 4.5
          assert ev.shape==(1,) and ev[0]==1.25
          expected={"negative":(7,"negative_print","density"),
                    "positive":(5,"direct_scan","density"),
                    "negativeGrain":(7,"negative_print","grainDensity")}
          for case,(count,branch,film_stage) in expected.items():
              path=directory/case/"candidate-source-tap-mapping.json"
              record=json.loads(path.read_text())
              assert record["status"]=="IOS_CANDIDATE_MAPPING_NOT_PYTHON_NUMERIC_PARITY"
              assert record["numerically_certified"] is False
              assert record["source_sha"]=="3bb2c2d2801ff68b92019cf1dbcbb133d60832bc"
              assert record["film_branch"]==branch
              mapping=record["source_to_ios_actual_observer"]
              assert len(record["source_tap_order"])==len(mapping)==count
              assert set(record["source_tap_order"])==set(mapping)
              assert len(set(mapping.values()))==count
              assert mapping["rgb_in"]=="iosInput"
              assert mapping["rgb_pre"]=="rgbPre"
              assert mapping["log_e_film"]=="logRaw"
              assert mapping["cmy_film"]==film_stage
              assert mapping["rgb_out"]=="iosOutput"
              if branch=="direct_scan":
                  assert "log_e_print" not in mapping and "cmy_print" not in mapping
              else:
                  assert mapping["log_e_print"]=="paperLogExposure"
                  assert mapping["cmy_print"]=="paperDevelopedDensity"
          print("PASS: real Swift 5/7 source candidate map JSON, branch/order/grain, NOT Python/iOS numeric parity")
          print("PASS: unmodified Swift Double NPY encoding and NumPy readback")
          PY
      - name: Configure original v1.8.51 fixture generation toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install baseline pinned fixture generator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            'numpy==1.26.4' 'scipy==1.15.3' 'colour-science==0.4.6' \
            'matplotlib==3.10.7' 'numba==0.61.2' 'opt_einsum==3.4.0' \
            'scikit-image==0.25.2'
      - name: Materialize all original Build76 generated Swift data before Xcode
        run: |
          set -euo pipefail
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_camera_batch.py
          python ios/scripts/generate_compact_catalog.py
          python ios/scripts/generate_spectral_data.py
          python ios/scripts/generate_original_optics.py
          python ios/scripts/generate_hanatos.py
          python ios/scripts/generate_build77_stock_halation.py
          python ios/scripts/generate_dir.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_hd_interpolation_reference.py
          python ios/scripts/generate_dir_spatial.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_spatial_dir_2d.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_full_frame.py
          python ios/scripts/generate_sublayer_grain.py
          python ios/scripts/generate_original_metal_grain.py
          python ios/scripts/generate_original_source_rng.py
          python ios/scripts/generate_source_iir.py
          python ios/scripts/generate_source_mt19937.py
          python ios/scripts/generate_original_scipy_rng.py
          python ios/scripts/generate_source_replay.py
          python ios/scripts/generate_source_microstructure.py
          NUMBA_CACHE_DIR="$(mktemp -d)" NUMBA_NUM_THREADS=1 \
            NUMBA_THREADING_LAYER=workqueue \
            python ios/scripts/generate_source_physical_grain.py
          python ios/scripts/generate_source_rgb_parity.py
          python ios/scripts/generate_source_print_scanner_parity.py
          python ios/scripts/generate_source_negative_print_chain.py
          python ios/scripts/generate_source_film_dir_print_chain.py
          python ios/scripts/generate_source_camera_film_print_chain.py
          python ios/scripts/validate_source_float64_original.py
          NUMBA_CACHE_DIR="$(mktemp -d)" NUMBA_NUM_THREADS=1 \
            NUMBA_THREADING_LAYER=workqueue \
            python ios/scripts/generate_source_physical_frame.py
          python ios/scripts/generate_build77_rgb_pre_original.py
          python ios/scripts/generate_scanner_reference.py
          python ios/scripts/generate_cam16_gamut.py
          python ios/scripts/generate_print_morph.py
          python ios/scripts/generate_print_optics.py
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
          test -s ios/SpektraFilmPort/GeneratedSourceReplayReference.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalOptics.swift
          test -s ios/SpektraFilmPort/GeneratedDIRData.swift
          test -s ios/SpektraFilmPort/GeneratedMeasuredProfiles.swift
          test -s ios/SpektraFilmPort/GeneratedSourceCameraReference.swift
          echo "Original source fixture generation complete; no algorithm substitutions"
      - name: Configure exact upstream Numba reference generator toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate original fast-statistics and scanner-glare Swift fixtures
        env:
          NUMBA_NUM_THREADS: "1"
          NUMBA_THREADING_LAYER: "workqueue"
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            'numpy==2.4.0' 'numba==0.64.0' 'scipy==1.16.3'
          python ios/scripts/generate_source_numba_fast_counts.py
          python ios/scripts/generate_source_scanner_glare.py
          test -s ios/SpektraFilmPort/GeneratedSourceNumbaFastCountsReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceScannerGlareReference.swift
      - name: "Build77: native full original source spectral numerical suite"
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/SpectralPhysics.swift \
            ios/SpektraFilmPort/OriginalSourcePixelIO.swift \
            ios/SpektraFilmPort/Build78HighBitDepthIngress.swift \
            ios/SpektraFilmPort/OriginalSourcePhysicalImage.swift \
            ios/SpektraFilmPort/OriginalSourcePhysicalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceCameraOptics.swift \
            ios/SpektraFilmPort/OriginalSourceDiffusion.swift \
            ios/SpektraFilmPort/OriginalSourceCameraBandpass.swift \
            ios/SpektraFilmPort/OriginalSourceFilmHalation.swift \
            ios/SpektraFilmPort/GeneratedSourceCameraReference.swift \
            ios/tests/OriginalSourceCameraBatchValidation.swift \
            ios/tests/SourcePhysicalImageParity.swift \
            ios/SpektraFilmPort/OriginalSourceRGBParity.swift \
            ios/SpektraFilmPort/GeneratedSourceRGBReference.swift \
            ios/SpektraFilmPort/OriginalPrintScannerParity.swift \
            ios/SpektraFilmPort/GeneratedSourcePrintScannerReference.swift \
            ios/SpektraFilmPort/OriginalNegativePrintChainParity.swift \
            ios/SpektraFilmPort/GeneratedSourceNegativePrintChainReference.swift \
            ios/SpektraFilmPort/OriginalFilmDIRPrintParity.swift \
            ios/SpektraFilmPort/GeneratedSourceFilmDIRPrintReference.swift \
            ios/SpektraFilmPort/OriginalCameraFilmPrintParity.swift \
            ios/SpektraFilmPort/GeneratedSourceCameraFilmPrintReference.swift \
            ios/SpektraFilmPort/SpatialDIR.swift \
            ios/SpektraFilmPort/SourceSpatialDIRConvolution.swift \
            ios/SpektraFilmPort/OriginalSourceScannerOptics.swift \
            ios/SpektraFilmPort/OriginalSourceScannerGlare.swift \
            ios/SpektraFilmPort/OriginalSourceNumbaSingleThreadNormal.swift \
            ios/SpektraFilmPort/DensityGrain.swift \
            ios/SpektraFilmPort/OriginalSublayerGrain.swift \
            ios/SpektraFilmPort/OriginalDiscreteGrain.swift \
            ios/SpektraFilmPort/OriginalMetalGrain.swift \
            ios/SpektraFilmPort/OriginalSourceMicrostructure.swift \
            ios/SpektraFilmPort/GeneratedSourceMicrostructureReference.swift \
            ios/SpektraFilmPort/GeneratedSourceReplayReference.swift \
            ios/SpektraFilmPort/OriginalSourceSciPyParticles.swift \
            ios/SpektraFilmPort/OriginalSourceSciPySampler.swift \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/GeneratedOriginalSciPyRNGReference.swift \
            ios/SpektraFilmPort/OriginalMetalIIR.swift \
            ios/SpektraFilmPort/GeneratedSourceIIRReference.swift \
            ios/SpektraFilmPort/OriginalPrintOptics.swift \
            ios/SpektraFilmPort/OriginalPrintMorph.swift \
            ios/SpektraFilmPort/OriginalPrintReference.swift \
            ios/SpektraFilmPort/GeneratedPrintMorphData.swift \
            ios/SpektraFilmPort/OriginalHanatosResponse.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/OriginalCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedCAM16Gamut.swift \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/SpektraFilmPort/GeneratedOriginalOptics.swift \
            ios/SpektraFilmPort/GeneratedHanatosData.swift \
            ios/SpektraFilmPort/GeneratedHanatosPreciseData.swift \
            ios/SpektraFilmPort/GeneratedDIRData.swift \
            ios/SpektraFilmPort/GeneratedSourceHDInterpolationReference.swift \
            ios/SpektraFilmPort/GeneratedSublayerGrainReference.swift \
            ios/tests/SourceFloat64ProfileValidation.swift \
            ios/tests/SourceHDInterpolationValidation.swift \
            ios/tests/Build78HighBitDepthValidation.swift \
            ios/tests/SpectralValidation.swift \
            -o /tmp/SpektrafilmSpectralValidation
      - name: Validate actual in-production optical paper stage taps
        run: |
          test -s ios/verification/generated-physical-v1.8.22/manifest.json
          test -s ios/verification/generated-physical-v1.8.22/kodak_neutral_fir.rgbPre.f64le
          /tmp/SpektrafilmSpectralValidation
      - name: Generate and compile unsigned iPhoneOS 16.5.1 Build77 app
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml
          cd ..
          xcodebuild -project ios/SpektraFilmPort.xcodeproj \
            -scheme SpektraFilmPort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify app architecture, deployment target and retained version
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app
          test -f "$APP/SpektraFilmPort"
          test -s "$APP/default.metallib"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx 1.8.52
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx 77
          xcrun lipo -archs "$APP/SpektraFilmPort" | grep -w arm64
          echo "Build77 unsigned test app 1.8.52(77) compiled; upstream scientific parity NOT certified"
      - name: Preserve host-generated Swift diagnostic tape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-ios-source-double-recorder-smoke-not-parity
          path: build77-evidence/swift/
          if-no-files-found: warn

  native-stock-byte-audit:
    name: Swift 28-stock F64/F32 source byte audit (not pixel parity)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Python 3.13 source fixture environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Original source identity and independent 28-stock manifest
        run: |
          python ios/scripts/build77_source_contract.py verify
          python ios/scripts/build77_measured_manifest.py \
            --output build77-evidence/independent-measured-profiles.json
      - name: Generate production Swift 28-stock measured data unchanged
        run: |
          python ios/scripts/generate_spectral_data.py
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
      - name: Parse changed iOS production profile integrity guard
        run: |
          xcrun swiftc -frontend -parse \
            ios/SpektraFilmPort/SpectralPhysics.swift
      - name: Compile independent native Swift consumer of production stock bytes
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/tests/Build77MeasuredProfileAudit.swift \
            -o /tmp/Build77MeasuredProfileAudit
      - name: Check every generated Swift profile against independent original JSON
        run: |
          /tmp/Build77MeasuredProfileAudit \
            build77-evidence/independent-measured-profiles.json \
            | tee build77-evidence/swift-28-stock-audit.txt
      - name: Retain original JSON versus native Swift audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-original-json-vs-native-swift-stock-bytes
          path: |
            build77-evidence/independent-measured-profiles.json
            build77-evidence/swift-28-stock-audit.txt
          if-no-files-found: warn


  native-parameter-digest-audit:
    name: Python original vs native Swift source-order parameter digest 360 cases
    runs-on: ubuntu-24.04
    needs: [python-reference-taps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build77-python-original-taps-not-swift-certified
          path: build77-evidence
      - name: Verify original 360-case oracle exists
        run: |
          test -s build77-evidence/parameter-digest.json
          python3 - <<'PY'
          import json
          p=json.load(open('build77-evidence/parameter-digest.json'))
          assert p['status']=='ORIGINAL_PYTHON_DIGEST_REFERENCE_NOT_IOS_PRODUCTION_PARITY'
          assert p['upstream_sha']=='3bb2c2d2801ff68b92019cf1dbcbb133d60832bc'
          assert len(p['cases'])==360
          print("PASS: 360 independently computed original Python parameter digest cases")
          PY
      - name: Compile native Swift production digest module and independent driver
        run: |
          swiftc --version
          swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/Build77ExactJSONValue.swift \
            ios/SpektraFilmPort/Build77OriginalParameterDigest.swift \
            ios/tests/Build77OriginalParameterDigestValidation.swift \
            -o /tmp/Build77OriginalParameterDigestValidation
      - name: Run real Swift parameter digest on all 360 original source inputs
        run: |
          /tmp/Build77OriginalParameterDigestValidation \
            build77-evidence/parameter-digest.json \
            build77-evidence/swift-parameter-digest.json
      - name: Require every original Python field to match Swift (no ignored fields)
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          ref=json.loads(Path('build77-evidence/parameter-digest.json').read_text())
          val=json.loads(Path('build77-evidence/swift-parameter-digest.json').read_text())
          assert val['status']=='SWIFT_DIGEST_SUBTREE_NOT_IOS_RENDER_PIPELINE_PARITY'
          expected=ref['cases']; actual=val['observed']
          assert len(expected)==len(actual)==360
          def check(e,a,path):
              if isinstance(e,bool):
                  assert type(a) is bool and e is a,(path,e,a)
              elif isinstance(e,(int,float)):
                  assert type(a) in (int,float) and math.isfinite(a) and e==a,(path,e,a)
              elif isinstance(e,str) or e is None:
                  assert type(e) is type(a) and e==a,(path,e,a)
              elif isinstance(e,list):
                  assert type(a) is list and len(e)==len(a),(path,e,a)
                  for i,(x,y) in enumerate(zip(e,a)): check(x,y,f'{path}[{i}]')
              elif isinstance(e,dict):
                  assert type(a) is dict and e.keys()==a.keys(),(path, set(e)-set(a),set(a)-set(e))
                  for k in e:check(e[k],a[k],f'{path}.{k}')
              else:raise AssertionError((path,type(e)))
          for index,(e,a) in enumerate(zip(expected,actual)):
              assert e['id']==a['id'],(index,e['id'],a['id'])
              check(e['expected'],a['actual'],e['id'])
          print("PASS: 360/360 original Python params_builder digests equal native Swift for EVERY scalar/list/map field")
          print("This is digest subtree parity only, not production UI binding or rendering parity.")
          PY
      - name: Preserve digest oracle, exact Swift result, and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-360-case-native-parameter-digest-parity-NOT-rendering
          path: |
            build77-evidence/parameter-digest.json
            build77-evidence/swift-parameter-digest.json
