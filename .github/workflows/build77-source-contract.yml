name: Build77 upstream source contract (01-05)

on:
  push:
    branches:
      - port/build77-source-contract-01-05
    paths:
      - "ios/scripts/build77_source_contract.py"
      - "ios/scripts/build77_measured_manifest.py"
      - "ios/scripts/generate_spectral_data.py"
      - "ios/tests/Build77MeasuredProfileAudit.swift"
      - "ios/SpektraFilmPort/SpectralPhysics.swift"
      - "ios/SpektraFilmPort/Build77StageTapeRecorder.swift"
      - "ios/tests/Build77StageTapeRecorderValidation.swift"
      - "src/spektrafilm/**"
      - "pyproject.toml"
      - ".github/workflows/build77-source-contract.yml"
  pull_request:
    paths:
      - "ios/scripts/build77_source_contract.py"
      - "ios/scripts/build77_measured_manifest.py"
      - "ios/scripts/generate_spectral_data.py"
      - "ios/tests/Build77MeasuredProfileAudit.swift"
      - "ios/SpektraFilmPort/SpectralPhysics.swift"
      - "ios/SpektraFilmPort/Build77StageTapeRecorder.swift"
      - "ios/tests/Build77StageTapeRecorderValidation.swift"
      - "src/spektrafilm/**"
      - "pyproject.toml"
      - ".github/workflows/build77-source-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-contract:
    name: Python source / 28 profiles / topology / schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Python 3.13 (upstream requires ~=3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and self-test the independent harness
        run: |
          python -m py_compile ios/scripts/build77_source_contract.py
          python ios/scripts/build77_source_contract.py self-test
      - name: Verify pinned upstream blobs and emit JSON evidence
        run: |
          python ios/scripts/build77_source_contract.py verify --report build77-evidence/source-contract.json
      - name: Retain report (source contract only, not iOS parity)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-source-contract
          path: build77-evidence/source-contract.json
          if-no-files-found: warn

  python-reference-taps:
    name: Python 3.13 original seven-tap evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install original Python runtime numerical libraries
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy~=2.4" "scipy~=1.17" "colour-science~=0.4.6" \
            "scikit-image~=0.26" "opt-einsum~=3.4.0" \
            "numba~=0.64" "pyfftw~=0.15.0" "matplotlib~=3.10" \
            "OpenImageIO~=3.1.11" "rawpy~=0.26.1" \
            "exiv2~=0.18.1" "lensfunpy~=1.18.0"
          python -m pip install --no-deps -e .
      - name: Create a fixed tiny RGB input, without seeding original runtime RNG
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          Path("build77-evidence").mkdir(exist_ok=True)
          rng = np.random.default_rng(771)
          image = 0.15 + 0.55*rng.random((6, 4, 3))
          np.save("build77-evidence/input.npy", image, allow_pickle=False)
          PY
      - name: Execute the real upstream negative-to-print pipeline once
        run: |
          python ios/scripts/build77_source_contract.py emit-taps \
            --input build77-evidence/input.npy \
            --output build77-evidence/negative-print \
            --film kodak_portra_400 --paper kodak_portra_endura
      - name: Execute the real upstream reversal/direct-scan pipeline once
        run: |
          python ios/scripts/build77_source_contract.py emit-taps \
            --input build77-evidence/input.npy \
            --output build77-evidence/direct-scan \
            --film fujifilm_provia_100f --paper kodak_portra_endura --scan-film
      - name: Verify reference tape serialization and comparator
        run: |
          python ios/scripts/build77_source_contract.py compare-taps \
            --reference build77-evidence/negative-print \
            --candidate build77-evidence/negative-print --atol 0
          python ios/scripts/build77_source_contract.py compare-taps \
            --reference build77-evidence/direct-scan \
            --candidate build77-evidence/direct-scan --atol 0
      - name: Preserve original stage tape bytes and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-python-original-taps-not-swift-certified
          path: build77-evidence/
          if-no-files-found: warn

  ios-stage-recorder:
    name: Actual Swift Double tape + unsigned iPhoneOS compile
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 16.5-compatible Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Compile/run actual Swift stage recorder host test
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/Build77StageTapeRecorder.swift \
            ios/tests/Build77StageTapeRecorderValidation.swift \
            -o /tmp/Build77StageTapeRecorderValidation
          mkdir -p build77-evidence/swift
          /tmp/Build77StageTapeRecorderValidation build77-evidence/swift
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Swift output with independent NumPy NPY decoder
        run: |
          python -m pip install --disable-pip-version-check "numpy~=2.4"
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          directory=Path("build77-evidence/swift")
          manifest=json.loads((directory/"manifest.json").read_text())
          assert manifest["status"] == "IOS_INTERNAL_DIAGNOSTIC_NOT_PYTHON_TAP_PARITY"
          raw=np.load(directory/"logRaw.npy",allow_pickle=False)
          ev=np.load(directory/"cameraAutoExposureEV.npy",allow_pickle=False)
          assert raw.dtype == np.dtype("<f8") and raw.shape == (1,2,3)
          assert raw[0,0,:].tolist() == [0.125,-1.0,0.25]
          assert np.isposinf(raw[0,1,0]) and np.isnan(raw[0,1,1])
          assert raw[0,1,2] == 4.5
          assert ev.shape==(1,) and ev[0]==1.25
          print("PASS: unmodified Swift Double NPY encoding and NumPy readback")
          PY
      - name: Generate and compile unsigned iPhoneOS 16.5.1 app (no IPA)
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml
          cd ..
          xcodebuild -project ios/SpektraFilmPort.xcodeproj \
            -scheme SpektraFilmPort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify app architecture, deployment target and retained version
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app
          test -f "$APP/SpektraFilmPort"
          test -s "$APP/default.metallib"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx 1.8.51
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx 76
          xcrun lipo -archs "$APP/SpektraFilmPort" | grep -w arm64
          echo "Build77 recorder compiled into unchanged Build76 identity; not released or certified"
      - name: Preserve host-generated Swift diagnostic tape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-ios-source-double-recorder-smoke-not-parity
          path: build77-evidence/swift/
          if-no-files-found: warn

  native-stock-byte-audit:
    name: Swift 28-stock F64/F32 source byte audit (not pixel parity)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Python 3.13 source fixture environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Original source identity and independent 28-stock manifest
        run: |
          python ios/scripts/build77_source_contract.py verify
          python ios/scripts/build77_measured_manifest.py \
            --output build77-evidence/independent-measured-profiles.json
      - name: Generate production Swift 28-stock measured data unchanged
        run: |
          python ios/scripts/generate_spectral_data.py
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
      - name: Parse changed iOS production profile integrity guard
        run: |
          xcrun swiftc -frontend -parse \
            ios/SpektraFilmPort/SpectralPhysics.swift
      - name: Compile independent native Swift consumer of production stock bytes
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/tests/Build77MeasuredProfileAudit.swift \
            -o /tmp/Build77MeasuredProfileAudit
      - name: Check every generated Swift profile against independent original JSON
        run: |
          /tmp/Build77MeasuredProfileAudit \
            build77-evidence/independent-measured-profiles.json \
            | tee build77-evidence/swift-28-stock-audit.txt
      - name: Retain original JSON versus native Swift audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-original-json-vs-native-swift-stock-bytes
          path: |
            build77-evidence/independent-measured-profiles.json
            build77-evidence/swift-28-stock-audit.txt
          if-no-files-found: warn
