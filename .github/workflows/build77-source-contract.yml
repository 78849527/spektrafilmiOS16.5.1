name: Build77 source contract + experimental unsigned IPA

on:
  push:
    branches:
      - port/build77-source-contract-01-05
    paths:
      - "ios/scripts/build77_source_contract.py"
      - "ios/scripts/build77_measured_manifest.py"
      - "ios/scripts/generate_spectral_data.py"
      - "ios/tests/Build77MeasuredProfileAudit.swift"
      - "ios/SpektraFilmPort/SpectralPhysics.swift"
      - "ios/project.yml"
      - "ios/SpektraFilmPort/Build77StageTapeRecorder.swift"
      - "ios/tests/Build77StageTapeRecorderValidation.swift"
      - "src/spektrafilm/**"
      - "pyproject.toml"
      - ".github/workflows/build77-source-contract.yml"
  pull_request:
    paths:
      - "ios/scripts/build77_source_contract.py"
      - "ios/scripts/build77_measured_manifest.py"
      - "ios/scripts/generate_spectral_data.py"
      - "ios/tests/Build77MeasuredProfileAudit.swift"
      - "ios/SpektraFilmPort/SpectralPhysics.swift"
      - "ios/project.yml"
      - "ios/SpektraFilmPort/Build77StageTapeRecorder.swift"
      - "ios/tests/Build77StageTapeRecorderValidation.swift"
      - "src/spektrafilm/**"
      - "pyproject.toml"
      - ".github/workflows/build77-source-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream-contract:
    name: Python source / 28 profiles / topology / schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Python 3.13 (upstream requires ~=3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and self-test the independent harness
        run: |
          python -m py_compile ios/scripts/build77_source_contract.py
          python ios/scripts/build77_source_contract.py self-test
      - name: Verify pinned upstream blobs and emit JSON evidence
        run: |
          python ios/scripts/build77_source_contract.py verify --report build77-evidence/source-contract.json
      - name: Retain report (source contract only, not iOS parity)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-source-contract
          path: build77-evidence/source-contract.json
          if-no-files-found: warn

  python-reference-taps:
    name: Python 3.13 original seven-tap evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install original Python runtime numerical libraries
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy~=2.4" "scipy~=1.17" "colour-science~=0.4.6" \
            "scikit-image~=0.26" "opt-einsum~=3.4.0" \
            "numba~=0.64" "pyfftw~=0.15.0" "matplotlib~=3.10" \
            "OpenImageIO~=3.1.11" "rawpy~=0.26.1" \
            "exiv2~=0.18.1" "lensfunpy~=1.18.0"
          python -m pip install --no-deps -e .
      - name: Create a fixed tiny RGB input, without seeding original runtime RNG
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          Path("build77-evidence").mkdir(exist_ok=True)
          rng = np.random.default_rng(771)
          image = 0.15 + 0.55*rng.random((6, 4, 3))
          np.save("build77-evidence/input.npy", image, allow_pickle=False)
          PY
      - name: Execute the real upstream negative-to-print pipeline once
        run: |
          python ios/scripts/build77_source_contract.py emit-taps \
            --input build77-evidence/input.npy \
            --output build77-evidence/negative-print \
            --film kodak_portra_400 --paper kodak_portra_endura
      - name: Execute the real upstream reversal/direct-scan pipeline once
        run: |
          python ios/scripts/build77_source_contract.py emit-taps \
            --input build77-evidence/input.npy \
            --output build77-evidence/direct-scan \
            --film fujifilm_provia_100f --paper kodak_portra_endura --scan-film
      - name: Verify reference tape serialization and comparator
        run: |
          python ios/scripts/build77_source_contract.py compare-taps \
            --reference build77-evidence/negative-print \
            --candidate build77-evidence/negative-print --atol 0
          python ios/scripts/build77_source_contract.py compare-taps \
            --reference build77-evidence/direct-scan \
            --candidate build77-evidence/direct-scan --atol 0
      - name: Preserve original stage tape bytes and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-python-original-taps-not-swift-certified
          path: build77-evidence/
          if-no-files-found: warn

  ios-stage-recorder:
    name: Actual Swift Double tape + unsigned iPhoneOS compile
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 16.5-compatible Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Compile/run actual Swift stage recorder host test
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/Build77StageTapeRecorder.swift \
            ios/tests/Build77StageTapeRecorderValidation.swift \
            -o /tmp/Build77StageTapeRecorderValidation
          mkdir -p build77-evidence/swift
          /tmp/Build77StageTapeRecorderValidation build77-evidence/swift
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Swift output with independent NumPy NPY decoder
        run: |
          python -m pip install --disable-pip-version-check "numpy~=2.4"
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          directory=Path("build77-evidence/swift")
          manifest=json.loads((directory/"manifest.json").read_text())
          assert manifest["status"] == "IOS_INTERNAL_DIAGNOSTIC_NOT_PYTHON_TAP_PARITY"
          raw=np.load(directory/"logRaw.npy",allow_pickle=False)
          ev=np.load(directory/"cameraAutoExposureEV.npy",allow_pickle=False)
          assert raw.dtype == np.dtype("<f8") and raw.shape == (1,2,3)
          assert raw[0,0,:].tolist() == [0.125,-1.0,0.25]
          assert np.isposinf(raw[0,1,0]) and np.isnan(raw[0,1,1])
          assert raw[0,1,2] == 4.5
          assert ev.shape==(1,) and ev[0]==1.25
          print("PASS: unmodified Swift Double NPY encoding and NumPy readback")
          PY
      - name: Configure original v1.8.51 fixture generation toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install baseline pinned fixture generator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            'numpy==1.26.4' 'scipy==1.15.3' 'colour-science==0.4.6' \
            'matplotlib==3.10.7' 'numba==0.61.2' 'opt_einsum==3.4.0' \
            'scikit-image==0.25.2'
      - name: Materialize all original Build76 generated Swift data before Xcode
        run: |
          set -euo pipefail
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_camera_batch.py
          python ios/scripts/generate_compact_catalog.py
          python ios/scripts/generate_spectral_data.py
          python ios/scripts/generate_original_optics.py
          python ios/scripts/generate_hanatos.py
          python ios/scripts/generate_dir.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_hd_interpolation_reference.py
          python ios/scripts/generate_dir_spatial.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_spatial_dir_2d.py
          NUMBA_CACHE_DIR="$(mktemp -d)" python ios/scripts/generate_source_full_frame.py
          python ios/scripts/generate_sublayer_grain.py
          python ios/scripts/generate_original_metal_grain.py
          python ios/scripts/generate_original_source_rng.py
          python ios/scripts/generate_source_iir.py
          python ios/scripts/generate_source_mt19937.py
          python ios/scripts/generate_original_scipy_rng.py
          python ios/scripts/generate_source_replay.py
          python ios/scripts/generate_source_microstructure.py
          NUMBA_CACHE_DIR="$(mktemp -d)" NUMBA_NUM_THREADS=1 \
            NUMBA_THREADING_LAYER=workqueue \
            python ios/scripts/generate_source_physical_grain.py
          python ios/scripts/generate_source_rgb_parity.py
          python ios/scripts/generate_source_print_scanner_parity.py
          python ios/scripts/generate_source_negative_print_chain.py
          python ios/scripts/generate_source_film_dir_print_chain.py
          python ios/scripts/generate_source_camera_film_print_chain.py
          python ios/scripts/validate_source_float64_original.py
          NUMBA_CACHE_DIR="$(mktemp -d)" NUMBA_NUM_THREADS=1 \
            NUMBA_THREADING_LAYER=workqueue \
            python ios/scripts/generate_source_physical_frame.py
          python ios/scripts/generate_scanner_reference.py
          python ios/scripts/generate_cam16_gamut.py
          python ios/scripts/generate_print_morph.py
          python ios/scripts/generate_print_optics.py
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
          test -s ios/SpektraFilmPort/GeneratedSourceReplayReference.swift
          test -s ios/SpektraFilmPort/GeneratedOriginalOptics.swift
          test -s ios/SpektraFilmPort/GeneratedDIRData.swift
          test -s ios/SpektraFilmPort/GeneratedMeasuredProfiles.swift
          test -s ios/SpektraFilmPort/GeneratedSourceCameraReference.swift
          echo "Original source fixture generation complete; no algorithm substitutions"
      - name: Configure exact upstream Numba reference generator toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate original fast-statistics and scanner-glare Swift fixtures
        env:
          NUMBA_NUM_THREADS: "1"
          NUMBA_THREADING_LAYER: "workqueue"
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            'numpy==2.4.0' 'numba==0.64.0' 'scipy==1.16.3'
          python ios/scripts/generate_source_numba_fast_counts.py
          python ios/scripts/generate_source_scanner_glare.py
          test -s ios/SpektraFilmPort/GeneratedSourceNumbaFastCountsReference.swift
          test -s ios/SpektraFilmPort/GeneratedSourceScannerGlareReference.swift
      - name: Generate and compile unsigned iPhoneOS 16.5.1 Build77 app
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml
          cd ..
          xcodebuild -project ios/SpektraFilmPort.xcodeproj \
            -scheme SpektraFilmPort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify app architecture, deployment target and retained version
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app
          test -f "$APP/SpektraFilmPort"
          test -s "$APP/default.metallib"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx 1.8.52
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx 77
          xcrun lipo -archs "$APP/SpektraFilmPort" | grep -w arm64
          echo "Build77 unsigned test app 1.8.52(77) compiled; upstream scientific parity NOT certified"
      - name: Package unsigned Build77 iPhoneOS app with exact tested bundle
        run: |
          set -euo pipefail
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/SpektraFilmPort.app
          IPA=SpektraFilmPort-iOS16.5.1-v1.8.52-Build77-EXPERIMENTAL-UNVERIFIED-unsigned.ipa
          test -f "$APP/SpektraFilmPort"
          test -s "$APP/default.metallib"
          mkdir -p ios/build/package/Payload
          cp -R "$APP" ios/build/package/Payload/
          cd ios/build/package
          /usr/bin/zip -q -r "../$IPA" Payload
          unzip -t "../$IPA" >/dev/null
          test -s "../$IPA"
          shasum -a 256 "../$IPA"
      - name: Upload unsigned Build77 IPA for transparent test distribution
        uses: actions/upload-artifact@v4
        with:
          name: build77-1p8p52-unsigned-test-ipa
          path: ios/build/SpektraFilmPort-iOS16.5.1-v1.8.52-Build77-EXPERIMENTAL-UNVERIFIED-unsigned.ipa
          if-no-files-found: error
      - name: Preserve host-generated Swift diagnostic tape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-ios-source-double-recorder-smoke-not-parity
          path: build77-evidence/swift/
          if-no-files-found: warn

  native-stock-byte-audit:
    name: Swift 28-stock F64/F32 source byte audit (not pixel parity)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Python 3.13 source fixture environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Original source identity and independent 28-stock manifest
        run: |
          python ios/scripts/build77_source_contract.py verify
          python ios/scripts/build77_measured_manifest.py \
            --output build77-evidence/independent-measured-profiles.json
      - name: Generate production Swift 28-stock measured data unchanged
        run: |
          python ios/scripts/generate_spectral_data.py
          test -s ios/SpektraFilmPort/GeneratedSpectralData.swift
      - name: Parse changed iOS production profile integrity guard
        run: |
          xcrun swiftc -frontend -parse \
            ios/SpektraFilmPort/SpectralPhysics.swift
      - name: Compile independent native Swift consumer of production stock bytes
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/GeneratedSpectralData.swift \
            ios/tests/Build77MeasuredProfileAudit.swift \
            -o /tmp/Build77MeasuredProfileAudit
      - name: Check every generated Swift profile against independent original JSON
        run: |
          /tmp/Build77MeasuredProfileAudit \
            build77-evidence/independent-measured-profiles.json \
            | tee build77-evidence/swift-28-stock-audit.txt
      - name: Retain original JSON versus native Swift audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build77-original-json-vs-native-swift-stock-bytes
          path: |
            build77-evidence/independent-measured-profiles.json
            build77-evidence/swift-28-stock-audit.txt
          if-no-files-found: warn

  build77-experimental-release:
    name: Publish unsigned Build77 TEST ONLY after all 4 jobs pass
    runs-on: ubuntu-latest
    needs: [upstream-contract, python-reference-taps, ios-stage-recorder, native-stock-byte-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/port/build77-source-contract-01-05'
    steps:
      - name: Download exact Build77 compiled IPA
        uses: actions/download-artifact@v4
        with:
          name: build77-1p8p52-unsigned-test-ipa
          path: build77-distribution
      - name: Verify unsigned payload SHA256 and publish immutable experimental Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=ios1651-v1.8.52-build77-source-contract-UNVERIFIED-TEST
          IPA=build77-distribution/SpektraFilmPort-iOS16.5.1-v1.8.52-Build77-EXPERIMENTAL-UNVERIFIED-unsigned.ipa
          test -s "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -l "$IPA" | grep -F 'Payload/SpektraFilmPort.app/SpektraFilmPort'
          sha256sum "$IPA"
          CURRENT_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/port/build77-source-contract-01-05" --jq '.object.sha')
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "::error::Branch changed after validation; refuse stale IPA release"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Immutable experimental tag already exists; refuse silent replacement"
            exit 1
          fi
          gh release create "$TAG" "$IPA" --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --prerelease \
            --title "TEST ONLY | SpektraFilm iOS 16.5.1 v1.8.52 Build77 - source contract 01-05" \
            --notes "Unsigned experimental iPhoneOS Build77 package compiled from this exact commit after Python original source contract, seven-tap SOURCE-ONLY fixture generation, 28-stock native byte audit, Swift recorder format validation, and arm64 iPhoneOS compile. Not certified for complete source Python↔Swift numeric parity, true matching iOS seven taps, default/parameter mapping, stochastic full-image equivalence, RAW, real-device runtime, or performance. Build77 01–05 remains IN PROGRESS. Requires signing to install; not a finished precision release."
          URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq '.assets[] | select(.name == "SpektraFilmPort-iOS16.5.1-v1.8.52-Build77-EXPERIMENTAL-UNVERIFIED-unsigned.ipa") | .browser_download_url')
          test -n "$URL"
          echo "Verified actual GitHub Release asset: $URL"
