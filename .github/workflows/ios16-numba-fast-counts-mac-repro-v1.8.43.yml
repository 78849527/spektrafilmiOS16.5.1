name: v1.8.43 macOS ARM source Numba prange seed and Swift exact replay

on:
  push:
    branches:
      - 'ios16.5.1/source-numba-fast-counts-ondevice-v1.8.43'
    paths:
      - 'ios/scripts/generate_source_numba_fast_counts.py'
      - 'ios/SpektraFilmPort/OriginalSourceNumbaFastCounts.swift'
      - 'ios/SpektraFilmPort/OriginalSourceNumbaSingleThreadNormal.swift'
      - 'ios/SpektraFilmPort/OriginalSourceNumbaFastCountsDiagnostic.swift'
      - 'ios/tests/SourceNumbaFastCountsValidation.swift'
      - '.github/workflows/ios16-numba-fast-counts-mac-repro-v1.8.43.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numba-mac-arm-source-repro:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - name: Check out exact pinned iPhoneOS candidate
        uses: actions/checkout@v4
      - name: Pin upstream fast stats and grain Git identities
        run: |
          test "$(git hash-object src/spektrafilm/utils/fast_stats.py)" = 9e80d29ce6b9f7820ae70f5c09da15edfaa70a0d
          test "$(git hash-object src/spektrafilm/model/grain.py)" = f2d2b23e3eab4f4a1d919f69bcb4aceb714e024d
          uname -m
      - name: Original source Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned NumPy 2.4 and Numba 0.64
        run: |
          python -m pip install --disable-pip-version-check --quiet 'numpy==2.4.0' 'numba==0.64.0'
      - name: Generate 3 x seeded same-worker Numba source replay counts on Mac
        env:
          NUMBA_NUM_THREADS: '1'
          NUMBA_THREADING_LAYER: 'workqueue'
        run: |
          python ios/scripts/generate_source_numba_fast_counts.py
          test -s ios/SpektraFilmPort/GeneratedSourceNumbaFastCountsReference.swift
          python ios/scripts/generate_source_mt19937.py
      - name: Compile and compare 540 NumPy/Numba source counts in native Swift
        run: |
          xcrun swiftc -Onone -parse-as-library \
            ios/SpektraFilmPort/OriginalSourceMT19937.swift \
            ios/SpektraFilmPort/GeneratedSourceMT19937Reference.swift \
            ios/SpektraFilmPort/OriginalSourceNumbaSingleThreadNormal.swift \
            ios/SpektraFilmPort/OriginalSourceNumbaFastCounts.swift \
            ios/SpektraFilmPort/OriginalSourceNumbaFastCountsDiagnostic.swift \
            ios/SpektraFilmPort/GeneratedSourceNumbaFastCountsReference.swift \
            ios/tests/SourceNumbaFastCountsValidation.swift \
            -o /tmp/SourceNumbaFastCountsValidation
          /tmp/SourceNumbaFastCountsValidation
      - name: Explicit certification boundary
        run: |
          echo "PASS: same Numba prange worker TLS, NumPy source vectors and native Swift CPU replay."
          echo "NOT CERTIFIED: unseeded Numba multiworker GPU / full-image RGB."
