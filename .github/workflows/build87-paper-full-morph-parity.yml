name: Build87 all paper full 256-node s023 morph original parity

on:
  push:
    branches:
      - 'port/build87-print-optics-reference-29-34-bulk'
    paths:
      - 'ios/SpektraFilmPort/OriginalPrintMorph.swift'
      - 'ios/scripts/build87_original_print_morph_oracle.py'
      - 'ios/tests/Build87FullPrintMorph160Validation.swift'
      - '.github/workflows/build87-paper-full-morph-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true-source-morph:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Report source SHA / real native Swift
        run: |
          git rev-parse HEAD
          swiftc --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source NumPy and SciPy CDF/Brent
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.15.3'
      - name: Execute ORIGINAL morph_curves.py AST full 8-stock 256-node oracle
        run: |
          python ios/scripts/build87_original_print_morph_oracle.py \
            /tmp/Build87PaperMorph.json /tmp/Build87SourcePrintModels.swift
          test -s /tmp/Build87PaperMorph.json
          test -s /tmp/Build87SourcePrintModels.swift
      - name: Verify actual production Swift parser
        run: |
          xcrun swiftc -frontend -parse ios/SpektraFilmPort/*.swift
      - name: Compile actual production Swift original s023 morph
        run: |
          xcrun swiftc -O -parse-as-library \
            /tmp/Build87SourcePrintModels.swift \
            ios/SpektraFilmPort/OriginalPrintMorph.swift \
            ios/tests/Build87FullPrintMorph160Validation.swift \
            -o /tmp/Build87PaperMorph
          /tmp/Build87PaperMorph /tmp/Build87PaperMorph.json
      - uses: actions/upload-artifact@v4
        with:
          name: build87-pinned-8-real-paper-160-256node-source-tapes
          path: /tmp/Build87PaperMorph.json
