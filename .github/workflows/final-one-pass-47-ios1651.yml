name: SpektraFilm ONE-PASS 47 acceptance Python RAW ICC memory (one artifact no IPA)
on:
  push:
    branches:
      - acceptance/final-one-pass-47-ios1651
    paths:
      - ios/scripts/final_one_pass_47_acceptance.py
      - .github/workflows/final-one-pass-47-ios1651.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-once:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Python original source stack
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.15.3' \
            'colour-science==0.4.6' 'matplotlib==3.10.7'
      - name: ONE RUN all 47 requirements, Python original, RAW, ICC, memory
        id: acceptance
        continue-on-error: true
        run: |
          python3 ios/scripts/final_one_pass_47_acceptance.py
      - name: Publish single report to job summary
        if: always()
        run: |
          if test -s /tmp/SpektraFilm-one-pass/one-pass.md; then
            cat /tmp/SpektraFilm-one-pass/one-pass.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpektraFilm-47-one-pass-JSON-MD-LOG-raw-original-not-certified
          path: /tmp/SpektraFilm-one-pass/
          if-no-files-found: warn
      - name: Fail only on source regression; preserve formal release BLOCKED
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/SpektraFilm-one-pass/one-pass.json')
          assert p.is_file(),"No consolidated acceptance JSON"
          d=json.loads(p.read_text())
          assert len(d['roadmap'])==47
          assert d['release_gate']=='BLOCKED' and not d['formal_original_certified']
          assert not d['new_IPA']
          assert d['passed_count']==d['total_count'],d['technical_failures']
          print('PASS all reproducible checks. Formal original-source certificate remains BLOCKED.')
          PY
