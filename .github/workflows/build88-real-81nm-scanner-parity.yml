name: Build88 real 81nm original source scanner all-stock XYZ RGB CCTF

on:
  push:
    branches:
      - 'port/build88-scanner-spectrum-glare-optics-35-37-bulk'
    paths:
      - 'ios/SpektraFilmPort/Build88OriginalScannerSpectrum.swift'
      - 'ios/scripts/build88_original_81nm_scanner_oracle.py'
      - 'ios/tests/Build88RealStock81nmScannerParity.swift'
      - '.github/workflows/build88-real-81nm-scanner-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-scanner-spectrum:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Report exact source and Swift version
        run: |
          git rev-parse HEAD
          swiftc --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original source spectral/colour maths
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            'numpy==2.4.0' 'scipy==1.16.3' \
            'colour-science==0.4.6' 'opt_einsum==3.4.0'
      - name: Execute original source 12-stock 81nm XYZ and Colour CCTF
        run: |
          python ios/scripts/build88_original_81nm_scanner_oracle.py \
            /tmp/build88-original-scanner-81nm.json
          test -s /tmp/build88-original-scanner-81nm.json
      - name: Generate actual original viewer adapted sRGB matrices
        run: |
          python ios/scripts/generate_scanner_reference.py
          test -s ios/SpektraFilmPort/GeneratedScannerReference.swift
      - name: Swift source syntax for full app
        run: |
          swiftc -frontend -parse ios/SpektraFilmPort/*.swift
      - name: Compile actual production source spectral and RGB functions
        run: |
          swiftc -O -parse-as-library \
            ios/SpektraFilmPort/GeneratedScannerReference.swift \
            ios/SpektraFilmPort/OriginalScannerMath.swift \
            ios/SpektraFilmPort/Build88OriginalScannerSpectrum.swift \
            ios/tests/Build88RealStock81nmScannerParity.swift \
            -o /tmp/Build88Spectrum81
          /tmp/Build88Spectrum81 /tmp/build88-original-scanner-81nm.json
      - uses: actions/upload-artifact@v4
        with:
          name: build88-12-pinned-real-stock-original-scanner-48-81nm-source-tapes
          path: /tmp/build88-original-scanner-81nm.json
