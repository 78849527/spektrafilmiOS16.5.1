name: Build104 isolate Swift parse failure per changed file
on:
  push:
    branches: ['hardening/build104-source-grain-branch-fidelity-ios1651']
    paths: ['.github/workflows/build104-fast-syntax-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -frontend -parse ios/SpektraFilmPort/Build104DeviceGrainEvidence.swift
  content-view:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -frontend -parse ios/SpektraFilmPort/ContentView.swift
  floating-editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -frontend -parse ios/SpektraFilmPort/FloatingEditorWorkspace.swift
  all-other-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse all other production source
        run: |
          set -euxo pipefail
          find ios/SpektraFilmPort -maxdepth 1 -name '*.swift' \
            ! -name 'Build104DeviceGrainEvidence.swift' \
            ! -name 'ContentView.swift' \
            ! -name 'FloatingEditorWorkspace.swift' -print0 \
            | xargs -0 swiftc -frontend -parse
