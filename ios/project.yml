name: SpektraFilmPort
options:
  bundleIdPrefix: com.twogou
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "4"
targets:
  SpektraFilmPort:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SpektraFilmPort
        excludes:
          - Info.plist
          - Resources
          - StockCatalog.swift
      - path: SpektraFilmPort/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twogou.spektrafilmport
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: SpektraFilmPort/Info.plist
      properties:
        CFBundleDisplayName: SpektraFilm Port
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
