name: SpektraFilmPort
options:
  bundleIdPrefix: com.twogou
  deploymentTarget:
    iOS: "16.5"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.5"
    MARKETING_VERSION: "1.8.45"
    CURRENT_PROJECT_VERSION: "70"
packages:
  NextLevel:
    path: Vendor/NextLevel
targets:
  SpektraFilmPort:
    type: application
    platform: iOS
    deploymentTarget: "16.5"
    dependencies:
      - package: NextLevel
    sources:
      - path: SpektraFilmPort
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twogou.spektrafilmport
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: SpektraFilmPort/Info.plist
      properties:
        CFBundleIdentifier: com.twogou.spektrafilmport
        CFBundleDisplayName: SpektraFilm Port
        NSCameraUsageDescription: 允许拍照并将照片直接交给 SpektraFilm 原版冲印处理。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 允许将渲染好的高清照片保存到系统相册。
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
