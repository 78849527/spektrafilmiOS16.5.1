name: SpektraFilmPort
options:
  bundleIdPrefix: com.twogou
  deploymentTarget:
    iOS: "16.5"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.5"
    MARKETING_VERSION: "1.8.26"
    CURRENT_PROJECT_VERSION: "51"
targets:
  SpektraFilmPort:
    type: application
    platform: iOS
    deploymentTarget: "16.5"
    sources:
      - path: SpektraFilmPort
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twogou.spektrafilmport
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: SpektraFilmPort/Info.plist
      properties:
        CFBundleIdentifier: com.twogou.spektrafilmport
        CFBundleDisplayName: SpektraFilm Port
        NSPhotoLibraryAddUsageDescription: 允许将渲染好的高清照片保存到系统相册。
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
