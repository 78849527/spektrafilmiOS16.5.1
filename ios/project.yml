name: SpektraFilmPort
options:
  bundleIdPrefix: com.twogou
  deploymentTarget:
    iOS: "16.5"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.5"
    MARKETING_VERSION: "1.8.78"
    CURRENT_PROJECT_VERSION: "112"
packages:
  NextLevel:
    path: Vendor/NextLevel
targets:
  SpektraFilmPort:
    type: application
    platform: iOS
    deploymentTarget: "16.5"
    dependencies:
      - package: NextLevel
    sources:
      - path: SpektraFilmPort
        excludes:
          - Info.plist
      - path: ../src/spektrafilm/data/luts/spectral_upsampling/irradiance_xy_tc.npy
        buildPhase: resources
      # Build92: verified original Python 12-stage source tapes packed as
      # a named folder reference and evaluated by the REAL iPhone app.
      # Recreated from original upstream Python by the CI BEFORE XcodeGen.
      - path: verification/generated-physical-v1.8.22
        type: folder
        buildPhase: resources
      # Build104: independent original Python grain.py 5x4 stage tapes
      # generated in CI and read by physical iPhone verification.
      - path: verification/generated-source-grain-v1.8.48
        type: folder
        buildPhase: resources
      - path: tests/SourcePhysicalImageParity.swift
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twogou.spektrafilmport
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        # LibRaw 0.22 pinned and built for iPhoneOS arm64 by Build94 CI.
        # The source is NOT embedded in this repo or replaced with a stub.
        SWIFT_OBJC_BRIDGING_HEADER: SpektraFilmPort/Build94LibRawBridge.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/build/vendor/LibRaw"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/build/vendor/LibRaw/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lraw"
          - "-lz"
          - "-lc++"
    info:
      path: SpektraFilmPort/Info.plist
      properties:
        CFBundleIdentifier: com.twogou.spektrafilmport
        CFBundleDisplayName: SpektraFilm Port
        # Exactly injected by Build101 CI from GITHUB_SHA and verified in
        # the compiled Info.plist and final IPA (not a static historical SHA).
        SFSourceCommit: "$(SF_SOURCE_COMMIT)"
        NSCameraUsageDescription: 允许拍照并将照片直接交给 SpektraFilm 原版冲印处理。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 允许将渲染好的高清照片保存到系统相册。
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
